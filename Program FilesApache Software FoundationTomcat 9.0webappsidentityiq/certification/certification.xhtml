<!-- Migrated Angular Code Start-->
<ui:composition template="/ngAppPage.xhtml">
  <sp:loadBundle basename="sailpoint.web.messages.iiqMessages" var="msgs"/>
  <ui:param name="useFlex" value="#{true}"/>
  
  <ui:define name="title">#{msgs.ui_certifications_title}</ui:define>
  <ui:define name="headerItems">

    <sp:style serveOffset="#{base.requestContextPath}/ui/css">
      <src>ng-sortable.css</src>
    </sp:style>

    <ui:include src="../ui/scriptData.xhtml" />
    <ui:include src="../ui/jspmInclude.xhtml" />

    <script type="text/javascript">
      System.import('#{base.requestContextPath}/ui/js/certification/main.js');
    </script>

  </ui:define>

  <ui:define name="body">
    <div class="sp-ui-app focusable-container">
      <sp-certification-root
        uiCertificationItemWorksheetColumns="#{sp:getColumnConfigJSON('uiCertificationItemWorksheetColumns')}"
        uiCertificationItemReturnedItemsColumns="#{sp:getColumnConfigJSON('uiCertificationItemReturnedItemsColumns')}"
        uiCertificationItemPolicyViolationsColumns="#{sp:getColumnConfigJSON('uiCertificationItemPolicyViolationsColumns')}"
        uiAdditionalCertificationInfoColumns="#{sp:getColumnConfigJSON('uiAdditionalCertificationInfoColumns')}"
        contextualHelpAccessReviewDetailURL="#{sp:getContextualHelpJSON('accessReviewDetailURL')}"
        contextualHelpAccessReviewSummaryCardURL="#{sp:getContextualHelpJSON('accessReviewSummaryCardURL')}"
      ></sp-certification-root>
    </div>
  </ui:define>

</ui:composition>
<!-- Migrated Angular Code End-->
</body>
</html>
