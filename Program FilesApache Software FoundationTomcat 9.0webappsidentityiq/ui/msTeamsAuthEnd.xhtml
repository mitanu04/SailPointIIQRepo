<!DOCTYPE html>
<html
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:h="http://java.sun.com/jsf/html"
    xmlns:sp="http://sailpoint.com/ui">
    <sp:loadBundle basename="sailpoint.web.messages.iiqMessages" var="msgs" />
    <h:head>
        <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>#{msgs.sailpoint_iiq}</title>
        <link rel="stylesheet" href="loader.css" />
        <script type="text/javascript">
            var loaderMessage = '#{msgs.teams_loader_message}';
        </script>
        <script src="loaderEnd.js" type="text/javascript"></script>
        <script src="js/msTeams/MSTeamsApp.js" type="text/javascript"></script>
        <script type="text/javascript">
            window.onload = function () {
                const uiIndexPage = '/ui/index.jsf';
                try {
                    const instance = MSTeamsApp?.getInstance();
                    if (instance) {
                        instance.notifySuccess();
                    } else {
                        // If instance is null/undefined, redirect to uiIndexPage
                        window.location.href = uiIndexPage;
                    }
                } catch (error) {
                    // If any error occurs during notifySuccess, redirect to uiIndexPage
                    window.location.href = uiIndexPage;
                }
            };
        </script>
    </h:head>
</html>
