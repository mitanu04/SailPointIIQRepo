<html xmlns:ui="http://java.sun.com/jsf/facelets"
      xmlns:f="http://java.sun.com/jsf/core"
      xmlns:h="http://java.sun.com/jsf/html"
      xmlns:t="http://myfaces.apache.org/tomahawk"
      xmlns:p="http://primefaces.org/ui"
      xmlns:sp="http://sailpoint.com/ui"
      xmlns="http://www.w3.org/1999/xhtml">
<body>
<ui:composition>
    <script type="text/javascript">
        <!--//--><![CDATA[//><!--
        helpKey = 'APPLICATION';

        function getFieldValue(field) {
            var val = null;
            var fileName = Ext.getDom(field);
            if (fileName) {
                val = fileName.value;
            }
            return val;
        }

        function aggregationWithDirectApis() {
            var scimApiSettings = Ext.getDom('scimApiSettings');
            if (document.getElementById("editForm:aggregationWithDirectApis").checked == true) {
                scimApiSettings.style.display = "";
            } else {
                scimApiSettings.style.display = "none";
            }
        }

        Ext.onReady(function () {
            aggregationWithDirectApis();
            toggleRealm();
            Page.on('beforeSave', function () {
                if (!hasCredentialConfiguration()) {
                    var host = getFieldValue('editForm:ips0_host');
                    Validator.validateNonBlankString(host, "The SAP IPS Host URL must be specified!");

                    var userName = getFieldValue('editForm:ips0_user');
                    Validator.validateNonBlankString(userName, "The Client ID must be specified!");

                    var password = getFieldValue('editForm:ips0_password');
                    Validator.validateNonBlankString(password, "The Client Secret must be specified!");

                    var proxySysId = getFieldValue('editForm:ips0_proxySystemId');
                    Validator.validateNonBlankString(proxySysId, "The SAP IPS Proxy System ID must be specified!");

                    if (document.getElementById("editForm:aggregationWithDirectApis").checked == true) {
                        var applicationUrl = getFieldValue('editForm:scim0_host');
                        Validator.validateNonBlankString(applicationUrl, "The Application URL must be specified!");
                        var tokenUrl = getFieldValue('editForm:scim0_token_url');
                        Validator.validateNonBlankString(tokenUrl, "The Token URL must be specified!");
                        var apiKey = getFieldValue('editForm:scim0_apiKey');
                        Validator.validateNonBlankString(apiKey, "The API Key must be specified!");
                        var anId = getFieldValue('editForm:scim0_anId');
                        Validator.validateNonBlankString(anId, "The Realm AN Id Key must be specified!");
                        var clientId = getFieldValue('editForm:scim0_client_id');
                        Validator.validateNonBlankString(clientId, "The Client ID must be specified!");
                        var clientSecret = getFieldValue('editForm:scim0_client_secret');
                        Validator.validateNonBlankString(clientSecret, "The Client Secret must be specified!");
                    }

                    var errors = Validator.getErrors();
                    if (errors && errors.length > 0) {
                        Validator.displayErrors('appErrorsTop');
                        return false;
                    }
                }
                //return false will cancel the save
                return true;
            });
        });

        function toggleRealm() {
            var managedGeneralInfo = Ext.getDom('managedGeneralInfo');
            var parentRealm = document.getElementById("editForm:realmType:0").checked;
            var childRealm = document.getElementById("editForm:realmType:1").checked;
            if (childRealm) {
                managedGeneralInfo.style.display = "";
            } else if (parentRealm) {
                managedGeneralInfo.style.display = "none";
            }
        }

         //--><!]]>
    </script>
    <f:view>
        <h:outputText styleClass="sectionHeader" value="#{msgs.con_form_ariba_connection_settings}"/>
        <br/>
        <br/>
        <div id="accountSettings" class='spContent'>
            <!-- SAP IPS Connection Settings-->
            <div class="" id="ipsConnSettings">
                <h:outputText styleClass="sectionHeader" value="#{msgs.con_form_sac_ariba_connection_settings}"/>
                <br/>
                <table class="spTable" style="border: 0px" cellspacing="0">
                    <tr>
                        <td class='titleColumn certScheduleTitleCol' valign="center">
                            <h:outputText style='padding:5px' value="#{msgs.con_form_ariba_ips_proxy_host}"/>
                            <h:outputText styleClass="requiredText" value="*"/>
                        </td>
                        <td class="certScheduleHelpCol" valign="middle">
                            <h:graphicImage
                                    id="imgHlpIpsHost" styleClass="helpIcon"
                                    url="/images/icons/dashboard_help_16.png"
                                    alt="#{help.help_con_form_ariba_ips_proxy_host}"/>
                        </td>
                        <td>
                            <h:inputText id="ips0_host"
                                         value="#{applicationObject.attributes['ips0_host']}"
                                         size="40"
                                         disabled="#{!sp:hasRight(facesContext, 'ManageApplication')}"
                                         readonly="#{!sp:hasRight(facesContext, 'ManageApplication')}"/>
                        </td>
                    </tr>
                    <tr>
                        <td class='titleColumn certScheduleTitleCol' valign="center">
                            <h:outputText style='padding:5px' value="#{msgs.con_form_ariba_ips_proxy_system_id}"/>
                            <h:outputText styleClass="requiredText" value="*"/>
                        </td>
                        <td class="certScheduleHelpCol" valign="middle">
                            <h:graphicImage
                                    id="imgHlpIpsProxySystemId" styleClass="helpIcon"
                                    url="/images/icons/dashboard_help_16.png"
                                    alt="#{help.help_con_form_ariba_ips_proxy_system_id}"/>
                        </td>
                        <td>
                            <h:inputText id="ips0_proxySystemId"
                                         value="#{applicationObject.attributes['ips0_proxySystemId']}"
                                         size="40"
                                         disabled="#{!sp:hasRight(facesContext, 'ManageApplication')}"
                                         readonly="#{!sp:hasRight(facesContext, 'ManageApplication')}"/>
                        </td>
                    </tr>
                    <tr>
                        <td class='titleColumn certScheduleTitleCol' valign="center">
                            <h:outputText style='padding:5px' value="#{msgs.con_form_ariba_ips_client_id}"/>
                            <h:outputText styleClass="requiredText" value="*"/>
                        </td>
                        <td class="certScheduleHelpCol" valign="middle">
                            <h:graphicImage
                                    id="imgHlpIpsUser" styleClass="helpIcon"
                                    url="/images/icons/dashboard_help_16.png"
                                    alt="#{help.help_con_form_ariba_ips_client_id}"/>
                        </td>
                        <td>
                            <h:inputText id="ips0_user"
                                         value="#{applicationObject.attributes['ips0_user']}"
                                         size="40"
                                         disabled="#{!sp:hasRight(facesContext, 'ManageApplication')}"
                                         readonly="#{!sp:hasRight(facesContext, 'ManageApplication')}"/>
                        </td>
                    </tr>
                    <tr>
                        <td class='titleColumn certScheduleTitleCol'>
                            <h:outputText
                                    style='padding:5px'
                                    value="#{msgs.con_form_ariba_ips_client_secret}"/>
                            <h:outputText
                                    styleClass="requiredText" value="*"/>
                        </td>
                        <td class="certScheduleHelpCol">
                            <h:graphicImage
                                    id="imgHlpIpsPassword" styleClass="helpIcon"
                                    url="/images/icons/dashboard_help_16.png"
                                    alt="#{help.help_con_form_ariba_ips_client_secret}"/>
                        </td>
                        <td>
                            <sp:inputSecret id="ips0_password"
                                            value="#{applicationObject.attributes['ips0_password']}"
                                            size="20"
                                            redisplay="true" autocomplete="off"
                                            disabled="#{!sp:hasRight(facesContext, 'ManageApplication')}"
                                            readonly="#{!sp:hasRight(facesContext, 'ManageApplication')}"/>
                        </td>
                    </tr>
                </table>
            </div>

            <!-- Realm Type Settings-->
            <div class="" id="realmSettings">
                <h:outputText styleClass="sectionHeader" value="#{msgs.con_form_sac_ariba_realmtype_settings}"/>
                <br/>
                <table class="spTable" style="border: 0px" cellspacing="0">
                    <tr>
                        <td class='titleColumn certScheduleTitleCol' valign="center">
                            <h:outputText style='padding:5px' value="#{msgs.con_form_sap_ariba_type}"/>
                            <h:outputText styleClass="requiredText" value="*"/>
                        </td>
                        <td class="certScheduleHelpCol" valign="middle">
                            <h:graphicImage id="imgHlpAccountTypes" styleClass="helpIcon"
                                            url="/images/icons/dashboard_help_16.png"
                                            alt="#{msgs.con_help_sap_ariba_relam_type}"/>

                        </td>
                        <td valign="center">
                            <h:selectOneRadio id="realmType" onclick='toggleRealm()'
                                              value="#{applicationObject.attributes['realmType']}"
                                              layout="pageDirection">
                                <f:selectItem itemLabel="#{msgs.con_form_sap_ariba_parent_relam}"
                                              itemValue="Parent"/>
                                <f:selectItem itemLabel="#{msgs.con_form_sap_ariba_child_relam}"
                                              itemValue="Child"/>
                            </h:selectOneRadio>
                        </td>
                    </tr>
                    <tr id="managedGeneralInfo">
                        <td class='titleColumn certScheduleTitleCol'>
                            <h:outputText style='padding:5px' value="#{msgs.con_form_sap_ariba_manage_general_info}"/>
                        </td>
                        <td class="certScheduleHelpCol">
                            <h:graphicImage id="imgHlpIsManagedGeneralInfo" styleClass="helpIcon"
                                            url="/images/icons/dashboard_help_16.png"
                                            alt="#{help.help_con_form_sap_ariba_manage_general_info}"/>
                        </td>
                        <td width="100%">
                            <h:selectBooleanCheckbox id='isManagedGeneralInfo'
                                                     value="#{applicationObject.attributes['isManagedGeneralInfo']}"
                                                     disabled="#{!sp:hasRight(facesContext, 'ManageApplication')}"/>
                        </td>
                    </tr>
                </table>
            </div>

            <div class="" id="aggregationSettings">
                <h:outputText styleClass="sectionHeader"
                              value="#{msgs.con_form_ariba_aggregation_settings}"/>
                <br/>
                <table class="spTable" style="border: 0px" cellspacing="0">
                    <tr>
                        <td class='titleColumn certScheduleTitleCol'>
                            <h:outputText style='padding:5px'
                                          value="#{msgs.con_form_ariba_aggregate_accounts_with_direct_apis}"/>
                        </td>
                        <td class="certScheduleHelpCol">
                            <h:graphicImage id="imgHlpManagedDisabledUser" styleClass="helpIcon"
                                            url="/images/icons/dashboard_help_16.png"
                                            alt="#{help.help_con_form_ariba_aggregate_accounts_with_direct_apis}"/>
                        </td>
                        <td valign="center">
                            <h:selectBooleanCheckbox id="aggregationWithDirectApis"
                                                     onclick="aggregationWithDirectApis()"
                                                     value="#{applicationObject.attributes['aggregationWithDirectApis']}"/>
                        </td>
                    </tr>
                </table>
            </div>

            <div class="" id="scimApiSettings">
                <h:outputText styleClass="sectionHeader" value="#{msgs.con_form_ariba_scim_api_settings}"/>
                <br/>
                <table class="spTable" style="border: 0px" cellspacing="0">
                    <tr>
                        <td class='titleColumn certScheduleTitleCol'>
                            <h:outputText
                                style='padding:5px'
                                value="#{msgs.con_form_ariba_scim_authentication_method}"/>
                            <h:outputText
                                styleClass="requiredText" value="*"/>
                        </td>
                        <td class="certScheduleHelpCol">
                            <h:graphicImage
                                id="imgHlpAuthenticationMethod" styleClass="helpIcon"
                                url="/images/icons/dashboard_help_16.png"
                                alt="#{help.help_con_form_ariba_scim_authentication_method}"/>
                        </td>
                        <td>
                            <h:selectOneMenu id="scim0_authType"
                                             value="#{applicationObject.attributes['scim0_authType']}"
                                             disabled="#{!sp:hasRight(facesContext, 'ManageApplication')}"
                                             readonly="#{!sp:hasRight(facesContext, 'ManageApplication')}">
                                <f:selectItem itemValue="OAuth2Login" itemLabel="OAuth 2.0"/>
                            </h:selectOneMenu>
                        </td>
                    </tr>
                    <tr>
                        <td class='titleColumn certScheduleTitleCol'>
                            <h:outputText
                                style='padding:5px'
                                value="#{msgs.con_form_ariba_scim_grant_type}"/>
                            <h:outputText
                                styleClass="requiredText" value="*"/>
                        </td>
                        <td class="certScheduleHelpCol">
                            <h:graphicImage
                                id="imgHlpGrantType" styleClass="helpIcon"
                                url="/images/icons/dashboard_help_16.png"
                                alt="#{help.help_con_form_ariba_scim_grant_type}"/>
                        </td>
                        <td>
                            <h:selectOneMenu id="scim0_grant_type"
                                             value="#{applicationObject.attributes['scim0_grant_type']}"
                                             disabled="#{!sp:hasRight(facesContext, 'ManageApplication')}"
                                             readonly="#{!sp:hasRight(facesContext, 'ManageApplication')}">
                                <f:selectItem itemValue="client_credentials" itemLabel="Client Credentials"/>
                            </h:selectOneMenu>
                        </td>
                    </tr>
                    <tr>
                        <td class='titleColumn certScheduleTitleCol' valign="center">
                            <h:outputText style='padding:5px' value="#{msgs.con_form_ariba_scim_application_url}"/>
                            <h:outputText styleClass="requiredText" value="*"/>
                        </td>
                        <td class="certScheduleHelpCol" valign="middle">
                            <h:graphicImage
                                id="imgHlpApplicationUrl" styleClass="helpIcon"
                                url="/images/icons/dashboard_help_16.png"
                                alt="#{help.help_con_form_ariba_scim_application_url}"/>
                        </td>
                        <td>
                            <h:inputText id="scim0_host"
                                         value="#{applicationObject.attributes['scim0_host']}"
                                         size="100"
                                         disabled="#{!sp:hasRight(facesContext, 'ManageApplication')}"
                                         readonly="#{!sp:hasRight(facesContext, 'ManageApplication')}"/>
                        </td>
                    </tr>
                    <tr>
                        <td class='titleColumn certScheduleTitleCol' valign="center">
                            <h:outputText style='padding:5px' value="#{msgs.con_form_ariba_scim_token_url}"/>
                            <h:outputText styleClass="requiredText" value="*"/>
                        </td>
                        <td class="certScheduleHelpCol" valign="middle">
                            <h:graphicImage
                                id="imgHlpTokenUrl" styleClass="helpIcon"
                                url="/images/icons/dashboard_help_16.png"
                                alt="#{help.help_con_form_ariba_scim_token_url}"/>
                        </td>
                        <td>
                            <h:inputText id="scim0_token_url"
                                         value="#{applicationObject.attributes['scim0_token_url']}"
                                         size="60"
                                         disabled="#{!sp:hasRight(facesContext, 'ManageApplication')}"
                                         readonly="#{!sp:hasRight(facesContext, 'ManageApplication')}"/>
                        </td>
                    </tr>
                    <tr>
                        <td class='titleColumn certScheduleTitleCol' valign="center">
                            <h:outputText style='padding:5px' value="#{msgs.con_form_ariba_scim_api_key}"/>
                            <h:outputText styleClass="requiredText" value="*"/>
                        </td>
                        <td class="certScheduleHelpCol" valign="middle">
                            <h:graphicImage
                                id="imgHlpApiKey" styleClass="helpIcon"
                                url="/images/icons/dashboard_help_16.png"
                                alt="#{help.help_con_form_ariba_scim_api_key}"/>
                        </td>
                        <td>
                            <h:inputText id="scim0_apiKey"
                                         value="#{applicationObject.attributes['scim0_apiKey']}"
                                         size="40"
                                         disabled="#{!sp:hasRight(facesContext, 'ManageApplication')}"
                                         readonly="#{!sp:hasRight(facesContext, 'ManageApplication')}"/>
                        </td>
                    </tr>
                    <tr>
                        <td class='titleColumn certScheduleTitleCol' valign="center">
                            <h:outputText style='padding:5px' value="#{msgs.con_form_ariba_scim_an_id}"/>
                            <h:outputText styleClass="requiredText" value="*"/>
                        </td>
                        <td class="certScheduleHelpCol" valign="middle">
                            <h:graphicImage
                                id="imgHlpAnId" styleClass="helpIcon"
                                url="/images/icons/dashboard_help_16.png"
                                alt="#{help.help_con_form_ariba_scim_an_id}"/>
                        </td>
                        <td>
                            <h:inputText id="scim0_anId"
                                         value="#{applicationObject.attributes['scim0_anId']}"
                                         size="40"
                                         disabled="#{!sp:hasRight(facesContext, 'ManageApplication')}"
                                         readonly="#{!sp:hasRight(facesContext, 'ManageApplication')}"/>
                        </td>
                    </tr>
                    <tr>
                        <td class='titleColumn certScheduleTitleCol' valign="center">
                            <h:outputText style='padding:5px' value="#{msgs.con_form_ariba_scim_client_id}"/>
                            <h:outputText styleClass="requiredText" value="*"/>
                        </td>
                        <td class="certScheduleHelpCol" valign="middle">
                            <h:graphicImage
                                id="imgHlpClientId" styleClass="helpIcon"
                                url="/images/icons/dashboard_help_16.png"
                                alt="#{help.help_con_form_ariba_scim_client_id}"/>
                        </td>
                        <td>
                            <h:inputText id="scim0_client_id"
                                         value="#{applicationObject.attributes['scim0_client_id']}"
                                         disabled="#{!sp:hasRight(facesContext, 'ManageApplication')}"
                                         readonly="#{!sp:hasRight(facesContext, 'ManageApplication')}"/>
                        </td>
                    </tr>
                    <tr>
                        <td class='titleColumn certScheduleTitleCol' valign="center">
                            <h:outputText style='padding:5px' value="#{msgs.con_form_ariba_scim_client_secret}"/>
                            <h:outputText styleClass="requiredText" value="*"/>
                        </td>
                        <td class="certScheduleHelpCol" valign="middle">
                            <h:graphicImage
                                id="imgHlpClientSecret" styleClass="helpIcon"
                                url="/images/icons/dashboard_help_16.png"
                                alt="#{help.help_con_form_ariba_scim_client_secret}"/>
                        </td>
                        <td>
                            <h:inputSecret id="scim0_client_secret"
                                           value="#{applicationObject.attributes['scim0_client_secret']}"
                                           redisplay="true" autocomplete="off"
                                           disabled="#{!sp:hasRight(facesContext, 'ManageApplication')}"
                                           readonly="#{!sp:hasRight(facesContext, 'ManageApplication')}"/>
                        </td>
                    </tr>
                </table>

            </div>
            <!--Page Size Settings-->
            <div class="" id="pageSizeSettings">
                <br/>
                <h:outputText styleClass="sectionHeader" value="#{msgs.con_form_ariba_page_size_settings}"/>
                <br/>
                <table class="spTable" style="border: 0px" cellspacing="0">
                    <tr id="pageSizeTr">
                        <td class='titleColumn certScheduleTitleCol'>
                            <h:outputText style='padding:5px' value="#{msgs.con_form_ariba_page_size}"/>
                            <h:outputText/>
                        </td>
                        <td class="certScheduleHelpCol">
                            <h:graphicImage
                                    id="imgHlpPageSize" styleClass="helpIcon"
                                    url="/images/icons/dashboard_help_16.png"
                                    alt="#{help.help_con_form_ariba_page_size_settings}"/>
                        </td>
                        <td>
                            <sp:inputText id="pageSize"
                                          value="#{applicationObject.attributes['pageSize']}"
                                          size="20"
                                          disabled="#{!sp:hasRight(facesContext, 'ManageApplication')}"
                                          readonly="#{!sp:hasRight(facesContext, 'ManageApplication')}">
                                <f:validateLongRange minimum="1" maximum="1000"/>
                            </sp:inputText>
                        </td>
                    </tr>
                </table>
            </div>
        </div>
    </f:view>
</ui:composition>
</body>
</html>
