<html xmlns:ui="http://java.sun.com/jsf/facelets"
      xmlns:f="http://java.sun.com/jsf/core"
      xmlns:h="http://java.sun.com/jsf/html"
      xmlns:sp="http://sailpoint.com/ui"
      xmlns="http://www.w3.org/1999/xhtml">
<body>

<ui:composition>

    <script type="text/javascript">
        <!--//--><![CDATA[//><!--
        helpKey = 'APPLICATION';

        function getFieldValue(field) {
            let val = null;
            const fieldName = Ext.getDom(field);
            if (fieldName) {
                val = fieldName.value;
            }
            return val;
        }

        function toggleCredentials(authenticationType) {
            const clientIdRow = Ext.get('clientIdRow');
            const clientSecretRow = Ext.get('clientSecretRow');
            const refreshTokenRow = Ext.get('refreshTokenRow');
            const tokenUrlRow = Ext.get('tokenUrlRow');
            const grantTypeRow = Ext.get('grantTypeRow');
            const orgIdRow = Ext.get('orgIdRow');

            if (authenticationType === '') {
                authenticationType = 'OAuth2';
            }

            if (authenticationType === 'OAuth2') {
                tokenUrlRow.setVisibilityMode(Ext.Element.DISPLAY);
                tokenUrlRow.show();
                clientIdRow.setVisibilityMode(Ext.Element.DISPLAY);
                clientIdRow.show();
                clientSecretRow.setVisibilityMode(Ext.Element.DISPLAY);
                clientSecretRow.show();
                refreshTokenRow.setVisibilityMode(Ext.Element.DISPLAY);
                refreshTokenRow.show();
                grantTypeRow.setVisibilityMode(Ext.Element.DISPLAY);
                grantTypeRow.show();
                orgIdRow.setVisibilityMode(Ext.Element.DISPLAY);
                orgIdRow.show();
            }
        }

        function isEmpty(value) {
            return value === '' || value === null;
        }

        Ext.onReady(function () {
            Ext.QuickTips.init();

            const pageSize = getFieldValue('editForm:pageSize');
            if (pageSize.length === 0) {
                Ext.getDom('editForm:pageSize').value = '100';
            }

            toggleCredentials("#{applicationObject.attributes['authenticationType']}");

            // This is our validation hook
            Page.on('beforeSave', function () {
                if (!hasCredentialConfiguration()) {
                    const authenticationType = getFieldValue('editForm:authenticationType');
                    const clientId = getFieldValue('editForm:client_id');
                    const clientSecret = getFieldValue('editForm:client_secret');
                    const refreshToken = getFieldValue('editForm:refresh_token');
                    const token_url = getFieldValue('editForm:token_url');
                    const hostUrl = getFieldValue('editForm:host');
                    const orgId = getFieldValue('editForm:org_id');

                    Validator.validateNonBlankString(hostUrl, "#{msgs.con_form_webexControlHub_error_message_hosturl}");

                    if (authenticationType === 'OAuth2' && isEmpty(token_url)) {
                        Validator.validateNonBlankString(token_url, "#{msgs.con_form_webexControlHub_error_message_token_url}");
                    }

                    if (authenticationType === 'OAuth2' && isEmpty(clientId)) {
                        Validator.validateNonBlankString(clientId, "#{msgs.con_form_webexControlHub_error_message_client_id}");
                    }

                    if (authenticationType === 'OAuth2' && isEmpty(clientSecret)) {
                        Validator.validateNonBlankString(clientSecret, "#{msgs.con_form_webexControlHub_error_message_client_secret}");
                    }

                    if (authenticationType === 'OAuth2' && isEmpty(refreshToken)) {
                        Validator.validateNonBlankString(refreshToken, "#{msgs.con_form_webexControlHub_error_message_refresh_token}");
                    }

                    if (authenticationType === 'OAuth2' && isEmpty(orgId)) {
                        Validator.validateNonBlankString(orgId, "#{msgs.con_form_webexControlHub_error_message_org_id}");
                    }

                    const errors = Validator.getErrors();
                    if (errors && errors.length > 0) {
                        const errorDivTop = Ext.getDom('formErrorsTop');
                        const errorDivBottom = Ext.getDom('formErrorsBottom');
                        Validator.displayErrors(errorDivBottom);
                        Validator.displayErrors(errorDivTop);
                        return false;
                    }
                }
                //return false will kill cancel the save
                return true;
            });

        });

        //--><!]]>
    </script>
    <f:view>
        <div id="webexControlHubConnectionSettings" class='spContent'>
            <h:outputText styleClass="sectionHeader"
                          value="#{msgs.con_form_webexControlHub_connection_settings}"/>
            <br/>
            <div id='formErrorsTop' class="formError" style="display: none"></div>

            <table class="spTable" style="border: 0px" cellspacing="0">

                <tr>
                    <td class='titleColumn certScheduleTitleCol' valign="center">
                        <h:outputText style='padding:5px'
                                      value="#{msgs.con_form_webexControlHub_url}"/>
                        <h:outputText styleClass="requiredText" value="*"/>
                    </td>

                    <td class="certScheduleHelpCol" valign="middle">
                        <h:graphicImage
                                id="imgHlpUrl" styleClass="helpIcon"
                                url="/images/icons/dashboard_help_16.png"
                                alt="#{help.help_con_webexControlHub_url}"/>
                    </td>
                    <td valign="middle">
                        <h:inputText id="host"
                                     value="#{applicationObject.attributes['host']}"
                                     disabled="#{!sp:hasRight(facesContext, 'ManageApplication')}"
                                     readonly="#{!sp:hasRight(facesContext, 'ManageApplication')}"
                                     requiredMessage="URL cannot be empty or blank!"/>
                    </td>
                </tr>

                <tr>
                    <td class='titleColumn certScheduleTitleCol'>
                        <h:outputText
                                style='padding:5px'
                                value="#{msgs.con_form_webexControlHub_auth_type}"/>
                    </td>
                    <td class="certScheduleHelpCol">
                        <h:graphicImage
                                id="imgHlpauthtype" styleClass="helpIcon"
                                url="/images/icons/dashboard_help_16.png"
                                alt="#{help.help_con_webexControlHub_auth_type}"/>
                    </td>
                    <td>
                        <h:selectOneMenu id="authenticationType"
                                         value="#{applicationObject.attributes['authenticationType']}"
                                         redisplay="true"
                                         disabled="#{!sp:hasRight(facesContext, 'ManageApplication')}"
                                         readonly="#{!sp:hasRight(facesContext, 'ManageApplication')}"
                                         onchange="toggleCredentials(this.value)">
                            <f:selectItem itemValue="OAuth2"
                                          itemLabel="#{msgs.con_form_webexControlHub_auth_type_oauth2}"/>
                        </h:selectOneMenu>
                    </td>
                </tr>

                <tr id="grantTypeRow">
                    <td class='titleColumn certScheduleTitleCol'>
                        <h:outputText
                                style='padding:5px'
                                value="#{msgs.con_form_webexControlHub_grant_type}"/>
                    </td>
                    <td class="certScheduleHelpCol">
                        <h:graphicImage
                                id="imgHlpGrantType" styleClass="helpIcon"
                                url="/images/icons/dashboard_help_16.png"
                                alt="#{help.help_con_webexControlHub_grant_type}"/>
                    </td>
                    <td>
                        <h:selectOneMenu id="grant_type"
                                         value="#{applicationObject.attributes['grant_type']}"
                                         redisplay="true"
                                         disabled="#{!sp:hasRight(facesContext, 'ManageApplication')}"
                                         readonly="#{!sp:hasRight(facesContext, 'ManageApplication')}"
                                         onchange="toggleCredentials(this.value)">
                            <f:selectItem itemValue="REFRESH_TOKEN"
                                          itemLabel="#{msgs.con_form_webexControlHub_refresh_token}"/>
                        </h:selectOneMenu>
                    </td>
                </tr>

                <tr id="tokenUrlRow">
                    <td class='titleColumn certScheduleTitleCol'>
                        <h:outputText
                                style='padding:5px'
                                value="#{msgs.con_form_webexControlHub_token_url}"/>
                        <h:outputText
                                styleClass="requiredText" value="*"/>
                    </td>
                    <td class="certScheduleHelpCol">
                        <h:graphicImage
                                id="imgHlpTokenUrl" styleClass="helpIcon"
                                url="/images/icons/dashboard_help_16.png"
                                alt="#{help.help_con_webexControlHub_token_url}"/>
                    </td>
                    <td>
                        <h:inputText id="token_url"
                                     value="#{applicationObject.attributes['token_url']}"
                                     redisplay="true"
                                     disabled="#{!sp:hasRight(facesContext, 'ManageApplication')}"
                                     readonly="#{!sp:hasRight(facesContext, 'ManageApplication')}"/>
                    </td>
                </tr>

                <tr id="clientIdRow">
                    <td class='titleColumn certScheduleTitleCol'>
                        <h:outputText
                                style='padding:5px'
                                value="#{msgs.con_form_webexControlHub_client_id}"/>
                        <h:outputText
                                styleClass="requiredText" value="*"/>
                    </td>
                    <td class="certScheduleHelpCol">
                        <h:graphicImage
                                id="imgHlpclientId" styleClass="helpIcon"
                                url="/images/icons/dashboard_help_16.png"
                                alt="#{help.help_con_webexControlHub_client_id}"/>
                    </td>
                    <td>
                        <h:inputText id="client_id"
                                     value="#{applicationObject.attributes['client_id']}"
                                     redisplay="true"
                                     disabled="#{!sp:hasRight(facesContext, 'ManageApplication')}"
                                     readonly="#{!sp:hasRight(facesContext, 'ManageApplication')}"/>
                    </td>
                </tr>

                <tr id="clientSecretRow">
                    <td class='titleColumn certScheduleTitleCol'>
                        <h:outputText
                                style='padding:5px'
                                value="#{msgs.con_form_webexControlHub_client_secret}"/>
                        <h:outputText
                                styleClass="requiredText" value="*"/>
                    </td>
                    <td class="certScheduleHelpCol">
                        <h:graphicImage
                                id="imgHlpClientSecret" styleClass="helpIcon"
                                url="/images/icons/dashboard_help_16.png"
                                alt="#{help.help_con_webexControlHub_client_secret}"/>
                    </td>
                    <td>
                        <sp:inputSecret id="client_secret"
                                        value="#{applicationObject.attributes['client_secret']}"
                                        redisplay="true" autocomplete="off"
                                        disabled="#{!sp:hasRight(facesContext, 'ManageApplication')}"
                                        readonly="#{!sp:hasRight(facesContext, 'ManageApplication')}"/>
                    </td>
                </tr>

                <tr id="refreshTokenRow">
                    <td class='titleColumn certScheduleTitleCol'><h:outputText
                            style='padding:5px'
                            value="#{msgs.con_form_webexControlHub_refresh_token}" /> <h:outputText
                            styleClass="requiredText" value="*" /></td>
                    <td class="certScheduleHelpCol"><h:graphicImage
                            id="imgHlpRefreshToken" styleClass="helpIcon"
                            url="/images/icons/dashboard_help_16.png"
                            alt="#{help.help_con_webexControlHub_refresh_token}" /></td>
                    <td><sp:inputSecret id="refresh_token"
                                        value="#{applicationObject.attributes['refresh_token']}"
                                        size="20" redisplay="true"
                                        autocomplete="off"
                                        disabled="#{!sp:hasRight(facesContext, 'ManageApplication')}"
                                        readonly="#{!sp:hasRight(facesContext, 'ManageApplication')}" /></td>
                </tr>

                <tr id="orgIdRow">
                    <td class='titleColumn certScheduleTitleCol'><h:outputText
                            style='padding:5px'
                            value="#{msgs.con_form_webexControlHub_org_id}" /> <h:outputText
                            styleClass="requiredText" value="*" /></td>
                    <td class="certScheduleHelpCol"><h:graphicImage
                            id="imgHlpOrgId" styleClass="helpIcon"
                            url="/images/icons/dashboard_help_16.png"
                            alt="#{help.help_con_webexControlHub_org_id}" /></td>
                    <td>
                        <h:inputText id="org_id"
                                     value="#{applicationObject.attributes['org_id']}"
                                     redisplay="true"
                                     disabled="#{!sp:hasRight(facesContext, 'ManageApplication')}"
                                     readonly="#{!sp:hasRight(facesContext, 'ManageApplication')}"/>
                    </td>
                </tr>
                <tr>
                    <td class='titleColumn certScheduleTitleCol'>
                        <h:outputText
                                style='padding:5px'
                                value="#{msgs.con_form_webexControlHub_page_size}"/>
                    </td>
                    <td class="certScheduleHelpCol">
                        <h:graphicImage
                                id="imgHlpPageSize" styleClass="helpIcon"
                                url="/images/icons/dashboard_help_16.png"
                                alt="#{help.help_con_webexControlHub_page_size}"/>
                    </td>
                    <td>
                        <h:inputText id="pageSize"
                                     value="#{applicationObject.attributes['pageSize']}"
                                     size="20"
                                     disabled="#{!sp:hasRight(facesContext, 'ManageApplication')}"
                                     readonly="#{!sp:hasRight(facesContext, 'ManageApplication')}">
                            <f:validateLongRange minimum="1" maximum="100"/>
                        </h:inputText>
                    </td>
                </tr>
            </table>
        </div>

        <div id="webexControlHubAggregationFilterSettings" class='spContent'>
            <h:outputText styleClass="sectionHeader"
                          value="#{msgs.con_form_webexControlHub_aggregation_filter_settings}"/>
            <br/>

            <table class="spTable" style="border: 0px" cellspacing="0">
                <tr>
                    <td class='titleColumn certScheduleTitleCol'>
                        <h:outputText
                                style='padding:5px'
                                value="#{msgs.con_form_webexControlHub_filter_attribute_account}"/>
                    </td>
                    <td class="certScheduleHelpCol">
                        <h:graphicImage
                                id="imgHlpAccountFilter" styleClass="helpIcon"
                                url="/images/icons/dashboard_help_16.png"
                                alt="#{help.help_con_webexControlHub_filter_attribute_account}"/>
                    </td>
                    <td>
                        <h:inputText id="accountFilterAttribute"
                                     value="#{applicationObject.attributes['accountFilterAttribute']}"
                                     disabled="#{!sp:hasRight(facesContext, 'ManageApplication')}"
                                     readonly="#{!sp:hasRight(facesContext, 'ManageApplication')}"/>
                    </td>
                </tr>

            </table>

            <br/>

            <table class="spTable" style="border: 0px" cellspacing="0">
                <tr>
                    <td class='titleColumn certScheduleTitleCol'>
                        <h:outputText
                                style='padding:5px'
                                value="#{msgs.con_form_webexControlHub_filter_attribute_group}"/>
                    </td>
                    <td class="certScheduleHelpCol">
                        <h:graphicImage
                                id="imgHlpGroupFilter" styleClass="helpIcon"
                                url="/images/icons/dashboard_help_16.png"
                                alt="#{help.help_con_form_webexControlHub_filter_attribute_group}"/>
                    </td>
                    <td>
                        <h:inputText id="groupFilterAttribute"
                                     value="#{applicationObject.attributes['groupFilterAttribute']}"
                                     disabled="#{!sp:hasRight(facesContext, 'ManageApplication')}"
                                     readonly="#{!sp:hasRight(facesContext, 'ManageApplication')}"/>
                    </td>
                </tr>

            </table>

        </div>

        <div id='formErrorsBottom' class="formError" style="display: none"></div>
    </f:view>
</ui:composition>

</body>
</html>
