<!DOCTYPE html PUBLIC
    "-//W3C//DTD XHTML 1.0 Transitional//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">


<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://java.sun.com/jsf/facelets"
      xmlns:f="http://java.sun.com/jsf/core"
      xmlns:h="http://java.sun.com/jsf/html"
      xmlns:c="http://java.sun.com/jstl/core"
      xmlns:t="http://myfaces.apache.org/tomahawk"
      xmlns:p="http://primefaces.org/ui"
      xmlns:sp="http://sailpoint.com/ui">
<body>

<ui:composition>

  <script type="text/javascript">
  </script>

  <f:view>


    <div class="" id="credentialsContainer">
      <div class="row">
        <div class="col-sm-12">
          <h:outputText styleClass="sectionHeader" value="Connection Settings"/>
        </div>
      </div>
      <br/>
      <br/>

      <div class="row spContent" id="credentials">
        <div class="col-sm-12" >
          <table class="spTable" style="border:0px" cellspacing="0">
            <tr>
              <td class='titleColumn certScheduleTitleCol'>
                <h:outputText style='padding:5px' value="#{msgs.con_form_azure_devops_baseURL}"/>
                <h:outputText styleClass="requiredText" value="*"/>
              </td>

              <td class="certScheduleHelpCol">
                <h:graphicImage id="imgHlpBaseURL" styleClass="helpIcon" url="/images/icons/dashboard_help_16.png"
                                alt="#{help.help_con_form_azure_devops_base_url}"/>

              </td>
              <td>
                <h:inputText id="azureDevopsBaseURL"
                             value="#{applicationObject.attributes['baseURL']}"
                             size="80"
                             disabled="#{!sp:hasRight(facesContext, 'ManageApplication')}"
                             readonly="#{!sp:hasRight(facesContext, 'ManageApplication')}"/>
              </td>
            </tr>
            <tr>
              <td class='titleColumn certScheduleTitleCol'>
                <h:outputText style='padding:5px' value="#{msgs.con_form_azure_devops_pat}"/>
                <h:outputText styleClass="requiredText" value="*"/>
              </td>

              <td class="certScheduleHelpCol">
                <h:graphicImage id="imgHlpPAT" styleClass="helpIcon" url="/images/icons/dashboard_help_16.png"
                                alt="#{help.help_con_form_azure_devops_personal_access_token}"/>

              </td>
              <td>
                <h:inputSecret id="personalAccessToken"
                               value="#{applicationObject.attributes['personalAccessToken']}"
                               redisplay="true"
                               size="80"
                               autocomplete="off"
                               disabled="#{!sp:hasRight(facesContext, 'ManageApplication')}"
                               readonly="#{!sp:hasRight(facesContext, 'ManageApplication')}"/>
              </td>
            </tr>
            <tr>
              <td class='titleColumn certScheduleTitleCol'>
                <h:outputText style='padding:5px' value="#{msgs.con_form_azure_devops_org_name}"/>
                <h:outputText styleClass="requiredText" value="*"/>
              </td>

              <td class="certScheduleHelpCol">
                <h:graphicImage id="imgHlpOrgName" styleClass="helpIcon" url="/images/icons/dashboard_help_16.png"
                                alt="#{help.help_con_form_azure_devops_organization_name}"/>

              </td>
              <td>
                <h:inputText id="orgName"
                             value="#{applicationObject.attributes['orgName']}"
                             redisplay="true"
                             size="80"
                             disabled="#{!sp:hasRight(facesContext, 'ManageApplication')}"
                             readonly="#{!sp:hasRight(facesContext, 'ManageApplication')}"/>
              </td>
            </tr>

          </table>

        </div>
      </div>
    </div>


  </f:view>
</ui:composition>
</body>
</html>
