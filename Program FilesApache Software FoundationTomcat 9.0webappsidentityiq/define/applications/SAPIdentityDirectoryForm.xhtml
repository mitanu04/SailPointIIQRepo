<html xmlns:ui="http://java.sun.com/jsf/facelets"
      xmlns:f="http://java.sun.com/jsf/core"
      xmlns:h="http://java.sun.com/jsf/html"
      xmlns:t="http://myfaces.apache.org/tomahawk"
      xmlns:p="http://primefaces.org/ui"
      xmlns:sp="http://sailpoint.com/ui"
      xmlns="http://www.w3.org/1999/xhtml">
<body>
<ui:composition>
    <script type="text/javascript">
        <!--//--><![CDATA[//><!--
        helpKey = 'APPLICATION';

        function getFieldValue(field) {
            var val = null;
            var fileName = Ext.getDom(field);
            if (fileName) {
                val = fileName.value;
            }
            return val;
        }

        Ext.onReady(function () {
            Page.on('beforeSave', function () {
                if (!hasCredentialConfiguration()) {
                    var host = getFieldValue('editForm:scim0_host');
                    Validator.validateNonBlankString(host, "The Application URL must be specified!");

                    var clientId = getFieldValue('editForm:scim0_user');
                    Validator.validateNonBlankString(clientId, "The Client ID must be specified!");

                    var clientSecret = getFieldValue('editForm:scim0_password');
                    Validator.validateNonBlankString(clientSecret, "The Client Secret must be specified!");

                    var errors = Validator.getErrors();
                    if (errors && errors.length > 0) {
                        Validator.displayErrors('appErrorsTop');
                        return false;
                    }
                }
                //return false will cancel the save
                return true;
            });
        });
        //--><!]]>
    </script>
    <f:view>
        <h:outputText styleClass="sectionHeader" value="#{msgs.con_form_sap_identity_directory_connection_settings}"/>
        <br/>
        <br/>
        <div id="accountSettings" class='spContent'>
            <!-- SCIM API Settings-->
            <div class='spContent' id="scimAPISettings">
                <table class="spTable" style="border: 0px" cellspacing="0">
                    <tr>
                        <td class='titleColumn certScheduleTitleCol' valign="center">
                            <h:outputText style='padding:5px' value="#{msgs.con_form_sap_identity_directory_application_url}"/>
                            <h:outputText styleClass="requiredText" value="*"/>
                        </td>
                        <td class="certScheduleHelpCol" valign="middle">
                            <h:graphicImage
                                id="imgHlpApplicationUrl" styleClass="helpIcon"
                                url="/images/icons/dashboard_help_16.png"
                                alt="#{help.help_con_form_sap_identity_directory_application_url}"/>
                        </td>
                        <td>
                            <h:inputText id="scim0_host"
                                         value="#{applicationObject.attributes['scim0_host']}"
                                         size="100"
                                         disabled="#{!sp:hasRight(facesContext, 'ManageApplication')}"
                                         readonly="#{!sp:hasRight(facesContext, 'ManageApplication')}"/>
                        </td>
                    </tr>
                    <tr>
                        <td class='titleColumn certScheduleTitleCol'>
                            <h:outputText
                                style='padding:5px'
                                value="#{msgs.con_form_sap_identity_directory_authentication_method}"/>
                            <h:outputText
                                styleClass="requiredText" value="*"/>
                        </td>
                        <td class="certScheduleHelpCol">
                            <h:graphicImage
                                id="imgHlpAuthenticationMethod" styleClass="helpIcon"
                                url="/images/icons/dashboard_help_16.png"
                                alt="#{help.help_con_form_sap_identity_directory_authentication_method}"/>
                        </td>
                        <td>
                            <h:selectOneMenu id="scim0_authType"
                                             value="#{applicationObject.attributes['scim0_authType']}"
                                             disabled="#{!sp:hasRight(facesContext, 'ManageApplication')}"
                                             readonly="#{!sp:hasRight(facesContext, 'ManageApplication')}">
                                <f:selectItem itemValue="Basic" itemLabel="Basic"/>
                            </h:selectOneMenu>
                        </td>
                    </tr>
                    <tr>
                        <td class='titleColumn certScheduleTitleCol' valign="center">
                            <h:outputText style='padding:5px' value="#{msgs.con_form_sap_identity_directory_client_id}"/>
                            <h:outputText styleClass="requiredText" value="*"/>
                        </td>
                        <td class="certScheduleHelpCol" valign="middle">
                            <h:graphicImage
                                id="imgHlpClientId" styleClass="helpIcon"
                                url="/images/icons/dashboard_help_16.png"
                                alt="#{help.help_con_form_sap_identity_directory_user}"/>
                        </td>
                        <td>
                            <h:inputText id="scim0_user"
                                         value="#{applicationObject.attributes['scim0_user']}"
                                         disabled="#{!sp:hasRight(facesContext, 'ManageApplication')}"
                                         readonly="#{!sp:hasRight(facesContext, 'ManageApplication')}"/>
                        </td>
                    </tr>
                    <tr>
                        <td class='titleColumn certScheduleTitleCol' valign="center">
                            <h:outputText style='padding:5px' value="#{msgs.con_form_sap_identity_directory_client_secret}"/>
                            <h:outputText styleClass="requiredText" value="*"/>
                        </td>
                        <td class="certScheduleHelpCol" valign="middle">
                            <h:graphicImage
                                id="imgHlpClientSecret" styleClass="helpIcon"
                                url="/images/icons/dashboard_help_16.png"
                                alt="#{help.help_con_form_sap_identity_directory_password}"/>
                        </td>
                        <td>
                            <sp:inputSecret id="scim0_password"
                                            value="#{applicationObject.attributes['scim0_password']}"
                                            redisplay="true" autocomplete="off"
                                            disabled="#{!sp:hasRight(facesContext, 'ManageApplication')}"
                                            readonly="#{!sp:hasRight(facesContext, 'ManageApplication')}"/>
                        </td>
                    </tr>
                </table>

            </div>

            <!--Page Size Settings-->
            <div class="" id="pageSizeSettings">
                <br/>
                <h:outputText styleClass="sectionHeader" value="#{msgs.con_form_sap_identity_directory_page_size_settings}"/>
                <br/>
                <table class="spTable" style="border: 0px" cellspacing="0">
                    <tr id="pageSizeTr">
                        <td class='titleColumn certScheduleTitleCol'>
                            <h:outputText style='padding:5px' value="#{msgs.con_form_sap_identity_directory_page_size}"/>
                            <h:outputText/>
                        </td>
                        <td class="certScheduleHelpCol">
                            <h:graphicImage
                                id="imgHlpPageSize" styleClass="helpIcon"
                                url="/images/icons/dashboard_help_16.png"
                                alt="#{help.help_con_form_sap_identity_directory_page_size_settings}"/>
                        </td>
                        <td>
                            <sp:inputText id="pageSize"
                                          value="#{applicationObject.attributes['pageSize']}"
                                          size="20"
                                          disabled="#{!sp:hasRight(facesContext, 'ManageApplication')}"
                                          readonly="#{!sp:hasRight(facesContext, 'ManageApplication')}">
                                <f:validateLongRange minimum="1" maximum="500"/>
                            </sp:inputText>
                        </td>
                    </tr>
                </table>
            </div>
        </div>
    </f:view>
</ui:composition>
</body>
</html>
