<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://java.sun.com/jsf/facelets"
      xmlns:f="http://java.sun.com/jsf/core"
      xmlns:h="http://java.sun.com/jsf/html"
      xmlns:t="http://myfaces.apache.org/tomahawk"
      xmlns:p="http://primefaces.org/ui"
      xmlns:sp="http://sailpoint.com/ui">
<body>

<ui:composition>

    <script type="text/javascript">
      <!--//--><![CDATA[//><!--
      helpKey = 'APPLICATION';

      function getFieldValue(fieldname) {
          var val = null;
          var field = Ext.getDom(fieldname);
          if ( field ) {
              val = field.value;
          }
          return val;
      }

      Ext.onReady(function () {
          Ext.QuickTips.init();
          // This is our validation hook
          Page.on('beforeSave', function() {
              if (!hasCredentialConfiguration()) {
                  var tenantDomain = getFieldValue('editForm:tenantDomain');
                  Validator.validateNonBlankString(tenantDomain, "Non-Employee Risk Management Tenant Domain Name cannot be null!");

                  var apiKey = getFieldValue('editForm:apiKey');
                  Validator.validateNonBlankString(apiKey, "API Key cannot be null!");

                  var errors = Validator.getErrors();
                  if (errors && errors.length > 0) {
                      Validator.displayErrors('appErrorsTop');
                      return false;
                  }
              }

              return true;
          });
      });

      //--><!]]>
    </script>
    <f:view>

    <h:outputText styleClass="sectionHeader" value="#{applicationObject.type} Connection Credentials"/><br/><br/>


    <div id="accountSettings" class='spContent'>
      <table class="spTable" style="border:0px" cellspacing="0">
        <tr>
          <td class='titleColumn certScheduleTitleCol'>
            <h:outputText style='padding:5px' value="#{msgs.con_form_nerm_tenant_domain_name}"/>
            <h:outputText styleClass="requiredText" value="*"/>
          </td>
          <td class="certScheduleHelpCol">
            <h:graphicImage id="imgHlpUrl" 
                            styleClass="helpIcon" 
                            url="/images/icons/dashboard_help_16.png" 
                            alt="#{help.help_con_nerm_tenant_domain_name}"/>
          </td>
          <td>
            <h:inputText id="tenantDomain"
                         value="#{applicationObject.attributes['tenantDomain']}"
                         size="40"
                         disabled="#{!sp:hasRight(facesContext, 'ManageApplication')}"
                         readonly="#{!sp:hasRight(facesContext, 'ManageApplication')}"/>
          </td>
        </tr>
        <tr>
          <td class='titleColumn certScheduleTitleCol'>
            <h:outputText style='padding:5px' value="#{msgs.con_form_nerm_api_key}"/>
            <h:outputText styleClass="requiredText" value="*"/>
          </td>
          <td class="certScheduleHelpCol">
            <h:graphicImage id="imgHlpPassword" 
                            styleClass="helpIcon" 
                            url="/images/icons/dashboard_help_16.png" 
                            alt="#{help.help_con_nerm_api_key}"/>
          </td>
          <td>
            <sp:inputSecret id="apiKey"
                            value="#{applicationObject.attributes['apiKey']}"
                            size="40"
                            redisplay="true"
                            autocomplete="off"
                            disabled="#{!sp:hasRight(facesContext, 'ManageApplication')}"
                            readonly="#{!sp:hasRight(facesContext, 'ManageApplication')}"/>
          </td>
        </tr>
        <tr>
            <td class='titleColumn certScheduleTitleCol'>
              <h:outputText style='padding:5px' value="#{msgs.con_form_nerm_page_size}"/>
            </td>
            <td class="certScheduleHelpCol">
              <h:graphicImage id="imgHlpChunkSize" styleClass="helpIcon" url="/images/icons/dashboard_help_16.png" 
                              alt="#{help.help_con_nerm_page_size}"/>
            </td>
            <td>
              <h:inputText id="pageSize"
                           value="#{applicationObject.attributes['pageSize']}"                              
                           size="3"
                           disabled="#{!sp:hasRight(facesContext, 'ManageApplication')}"                          
                           readonly="#{!sp:hasRight(facesContext, 'ManageApplication')}">
                           <f:validateLongRange minimum="1" maximum="500"/>
              </h:inputText>
            </td>
          </tr>
        <tr>
            <td class='titleColumn certScheduleTitleCol'><h:outputText
                style='padding:5px'
                value="#{msgs.con_form_nerm_fetch_inactive_user}" />
            </td>
            <td class="certScheduleHelpCol" valign="middle"><h:graphicImage
                id="imgHlpManageAdministratorUser" styleClass="helpIcon"
                url="/images/icons/dashboard_help_16.png"
                alt="#{help.help_con_nerm_fetch_inactive_user}" />
            </td>
            <td><h:selectBooleanCheckbox
                id="FetchInactivUser"
                value="#{applicationObject.attributes['FetchInactivUser']}"
                disabled="#{!sp:hasRight(facesContext, 'ManageApplication')}" />
            </td>
          </tr>
        </table><br/><br/>
        </div>
       
        

    </f:view>
</ui:composition>
</body>
</html>
