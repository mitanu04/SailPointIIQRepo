    <script type="text/javascript">
      <!--//--><![CDATA[//><!--
        helpKey = 'APPLICATION';
        function getFieldValue(field) {
            var val = null;
            var fileName = Ext.getDom(field);
            if ( fileName ) {
               val = fileName.value;
            }
            return val;
        }

        function toggleCredentials(authenticationType) {
          var userNameObj = Ext.get('usernameRow');
          var passwordObj = Ext.get('passwordRow');
          var patObj = Ext.get('personalaccesstokenRow');
          var autoRefreshObj = Ext.get('autoRefreshRow');

          if (authenticationType == "") {
              authenticationType = "Basic";
          }

          if (authenticationType == "Basic") {
              userNameObj.setVisibilityMode(Ext.Element.DISPLAY);
              userNameObj.show();
              passwordObj.setVisibilityMode(Ext.Element.DISPLAY);
              passwordObj.show();
              patObj.setVisibilityMode(Ext.Element.DISPLAY);
              patObj.hide();
              autoRefreshObj.setVisibilityMode(Ext.Element.DISPLAY);
              autoRefreshObj.hide();
          } else if (authenticationType == "PAT") {
              userNameObj.setVisibilityMode(Ext.Element.DISPLAY);
              userNameObj.hide();
              passwordObj.setVisibilityMode(Ext.Element.DISPLAY);
              passwordObj.hide();
              patObj.setVisibilityMode(Ext.Element.DISPLAY);
              patObj.show();
              autoRefreshObj.setVisibilityMode(Ext.Element.DISPLAY);
              autoRefreshObj.show();
          }
      }

      function toggleFileAggregationConfig() {
          var isFileAggregationEnabled="";
          var checkbox = document.getElementById('editForm:aggregateFromFile');
          if (checkbox) {
              isFileAggregationEnabled = checkbox.checked;
          } else {
              isFileAggregationEnabled = false;
          }

          var sftpPortObj = Ext.get('sftpPortRow');
          var accountDetailsFilePathObj = Ext.get('accountDetailsFilePathRow');
          var isConfigSameForSFTPObj = Ext.get('isConfigSameForSFTPRow');

          if(isFileAggregationEnabled == true){
              sftpPortObj.setVisibilityMode(Ext.Element.DISPLAY);
              sftpPortObj.show();
              accountDetailsFilePathObj.setVisibilityMode(Ext.Element.DISPLAY);
              accountDetailsFilePathObj.show();
              isConfigSameForSFTPObj.setVisibilityMode(Ext.Element.DISPLAY);
              isConfigSameForSFTPObj.show();
          }else {
              sftpPortObj.setVisibilityMode(Ext.Element.DISPLAY);
              sftpPortObj.hide();
              accountDetailsFilePathObj.setVisibilityMode(Ext.Element.DISPLAY);
              accountDetailsFilePathObj.hide();
              isConfigSameForSFTPObj.setVisibilityMode(Ext.Element.DISPLAY);
              isConfigSameForSFTPObj.hide();
          }
      }

      function toggleIsConfigSameForSFTP(){
          var isConfigSameForSFTPEnabled="";
          var isConfigSameForSFTPEnabledCheckbox = document.getElementById('editForm:isConfigSameForSFTP');

          if (isConfigSameForSFTPEnabledCheckbox) {
              isConfigSameForSFTPEnabled = isConfigSameForSFTPEnabledCheckbox.checked;
          } else {
              isConfigSameForSFTPEnabled = false;
          }

          var isFileAggregationEnabled="";
          var isFileAggregationEnabledCheckbox = document.getElementById('editForm:aggregateFromFile');
          if (isFileAggregationEnabledCheckbox) {
              isFileAggregationEnabled = isFileAggregationEnabledCheckbox.checked;
          } else {
              isFileAggregationEnabled = false;
          }

          var sftpHostObj = Ext.get('sftpHostRow');
          var sftpUserObj = Ext.get('sftpUserRow');
          var sftpUserPasswordObj = Ext.get('sftpUserPasswordRow');

          if(isConfigSameForSFTPEnabled && isFileAggregationEnabled){
              sftpHostObj.setVisibilityMode(Ext.Element.DISPLAY);
              sftpHostObj.hide();
              sftpUserObj.setVisibilityMode(Ext.Element.DISPLAY);
              sftpUserObj.hide();
              sftpUserPasswordObj.setVisibilityMode(Ext.Element.DISPLAY);
              sftpUserPasswordObj.hide();

          }else if(!isConfigSameForSFTPEnabled && !isFileAggregationEnabled){
              sftpHostObj.setVisibilityMode(Ext.Element.DISPLAY);
              sftpHostObj.hide();
              sftpUserObj.setVisibilityMode(Ext.Element.DISPLAY);
              sftpUserObj.hide();
              sftpUserPasswordObj.setVisibilityMode(Ext.Element.DISPLAY);
              sftpUserPasswordObj.hide();

          }else {
              sftpHostObj.setVisibilityMode(Ext.Element.DISPLAY);
              sftpHostObj.show();
              sftpUserObj.setVisibilityMode(Ext.Element.DISPLAY);
              sftpUserObj.show();
              sftpUserPasswordObj.setVisibilityMode(Ext.Element.DISPLAY);
              sftpUserPasswordObj.show();
          }
      }
      
      function enableAutoRefreshToken() {
            var autoRefreshCheckbox = document.getElementById('editForm:enableAutoRefreshToken');
            var isAutoRefreshEnabled = "";

            if(autoRefreshCheckbox) {
                isAutoRefreshEnabled = autoRefreshCheckbox.checked;
            } else {
                isAutoRefreshEnabled = false;
            }

            var tokenNameObj = Ext.get('tokenNameRow');
            var numberOfDaysUntilExpiryObj = Ext.get('numberOfDaysUntilExpiryRow');
            if(isAutoRefreshEnabled) {
                tokenNameObj.setVisibilityMode(Ext.Element.DISPLAY);
                tokenNameObj.show();
                numberOfDaysUntilExpiryObj.setVisibilityMode(Ext.Element.DISPLAY);
                numberOfDaysUntilExpiryObj.show();
            } else {
                tokenNameObj.setVisibilityMode(Ext.Element.DISPLAY);
                tokenNameObj.hide();
                numberOfDaysUntilExpiryObj.setVisibilityMode(Ext.Element.DISPLAY);
                numberOfDaysUntilExpiryObj.hide();
            }
        }

      Ext.onReady(function () {
           Ext.QuickTips.init();

           toggleCredentials('#{applicationObject.attributes["authenticationType"]}');
           toggleFileAggregationConfig();
           toggleIsConfigSameForSFTP();
           enableAutoRefreshToken();


           var pageSize = getFieldValue('editForm:pageSize');
           if (pageSize.length == 0) {
               // Maximum page size supported by Atlassian is 1000, Set default pageSize to 50.
               Ext.getDom('editForm:pageSize').value = '50';
           }

           var sftpPort = getFieldValue('editForm:sftpPort');
           if (sftpPort.length == 0) {
               Ext.getDom('editForm:sftpPort').value = '22';
           }
           
           var connectionTimeout = getFieldValue('editForm:connectionTimeout');
           if (connectionTimeout.length == 0) {
               // Set default connectionTimeout to 1.
               Ext.getDom('editForm:connectionTimeout').value = '1';
           }
           
           var numberOfDaysUntilExpiry = getFieldValue('editForm:numberOfDaysUntilExpiry');
           if(numberOfDaysUntilExpiry.length == 0) {
               Ext.getDom('editForm:numberOfDaysUntilExpiry').value = '90';
           }
            
           // This is our validation hook
           Page.on('beforeSave', function() {
               if (!hasCredentialConfiguration()) {

                   var baseURL = getFieldValue('editForm:baseURL');
                   Validator.validateNonBlankString(baseURL, "#{msgs.err_atlassian_account_missing_baseURL}");

                   var authenticationType = getFieldValue('editForm:authenticationType');

                  if(authenticationType == "PAT"){

                      var personalaccesstoken = getFieldValue('editForm:personalaccesstoken');
                      Validator.validateNonBlankString(personalaccesstoken, "#{msgs.err_atlassian_account_missing_personalaccesstoken}");

                      let isAutoRefreshEnable = document.getElementById('editForm:enableAutoRefreshToken');
                      
                      if(isAutoRefreshEnable.checked) {
                          var tokenName = getFieldValue('editForm:tokenName');
                          Validator.validateNonBlankString(tokenName, "#{msgs.err_atlassian_account_missing_token_name}");
                      }
                  } else {

                      var username = getFieldValue('editForm:username');
                      Validator.validateNonBlankString(username, "#{msgs.err_atlassian_account_missing_username}");

                      var password = getFieldValue('editForm:password');
                      Validator.validateNonBlankString(password, "#{msgs.err_atlassian_account_missing_password}");
                  }

                   let aggregateFromFileCheckbox = document.getElementById('editForm:aggregateFromFile');
                   if (aggregateFromFileCheckbox.checked) {
                       var sftpPort = getFieldValue('editForm:sftpPort');
                       Validator.validateNonBlankString(sftpPort, "#{msgs.err_atlassian_account_missing_sftpPort}");

                       var accountDetailsFilePath = getFieldValue('editForm:accountDetailsFilePath');
                       Validator.validateNonBlankString(accountDetailsFilePath, "#{msgs.err_atlassian_account_missing_accountDetailsFilePath}");
                   }

                   let isConfigSameForSFTPCheckbox = document.getElementById('editForm:isConfigSameForSFTP');
                   if (!isConfigSameForSFTPCheckbox.checked && aggregateFromFileCheckbox.checked) {
                       var sftpHost = getFieldValue('editForm:sftpHost');
                       Validator.validateNonBlankString(sftpHost, "#{msgs.err_atlassian_account_missing_sftpHost}");

                       var sftpUser = getFieldValue('editForm:sftpUser');
                       Validator.validateNonBlankString(sftpUser, "#{msgs.err_atlassian_account_missing_sftpUser}");

                       var sftpUserPassword = getFieldValue('editForm:sftpUserPassword');
                       Validator.validateNonBlankString(sftpUserPassword, "#{msgs.err_atlassian_account_missing_sftpUserPassword}");
                   }

                   var errors = Validator.getErrors();
                   if (errors && errors.length > 0) {
                       Validator.displayErrors('appErrorsTop');
                       return false;
                   }
               }
               //return false will kill cancel the save
               return true;
           });
        });
       //--><!]]>
    </script>

          <tr id="accountDetailsFilePathRow">

              <h:outputText styleClass="requiredText" value="*"/>
