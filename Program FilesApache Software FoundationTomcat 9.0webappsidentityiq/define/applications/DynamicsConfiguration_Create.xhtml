<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://java.sun.com/jsf/facelets"
      xmlns:f="http://java.sun.com/jsf/core"
      xmlns:h="http://java.sun.com/jsf/html"
      xmlns:c="http://java.sun.com/jstl/core"
      xmlns:t="http://myfaces.apache.org/tomahawk"
      xmlns:p="http://primefaces.org/ui"
      xmlns:sp="http://sailpoint.com/ui">
<body>
<ui:composition>
    <script type="text/javascript">
        <!--//--><![CDATA[//><!--
        helpKey = 'APPLICATION';


        Ext.onReady(function () {
            Ext.QuickTips.init();

        });

        //--><!]]>
    </script>
    <f:view>
        <div id="provisioningSettings" class='spContent'>
            <table class="spTable" style="border: 0px" cellspacing="0">
                <br/>
                <h:outputText styleClass="sectionHeader" value="#{msgs.con_form_dfo_provisioning_Settings}"/>
                <br/>
                <tr>
                    <td class='titleColumn certScheduleTitleCol'>
                        <h:outputText style='padding:5px' value="#{msgs.con_form_dfo_enable_create_account}"/>
                    </td>
                    <td class="certScheduleHelpCol">
                        <h:graphicImage id="imgHlpEnableCreateAccount" styleClass="helpIcon"
                                        url="/images/icons/dashboard_help_16.png"
                                        alt="#{msgs.help_con_form_dfo_enable_create}"/>
                    </td>
                    <td valign="center">
                        <h:selectBooleanCheckbox id="isCreateAccountEnabled"
                                                 value="#{applicationObject.attributes['isCreateAccountEnabled']}"/>
                    </td>
                </tr>
            </table>
        </div>
    </f:view>
    <style>
        .hidden {
            display:none;
        }
        .top0{
            margin-top: 0px !important;
        }
    </style>
