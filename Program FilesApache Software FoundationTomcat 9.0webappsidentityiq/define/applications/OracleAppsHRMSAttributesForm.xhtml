<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://java.sun.com/jsf/facelets"
      xmlns:f="http://java.sun.com/jsf/core"
      xmlns:h="http://java.sun.com/jsf/html"
      xmlns:t="http://myfaces.apache.org/tomahawk"
      xmlns:p="http://primefaces.org/ui"
      xmlns:sp="http://sailpoint.com/ui">
<body>

<ui:composition>

    <script type="text/javascript">
      <!--//--><![CDATA[//><!--
        helpKey = 'APPLICATION';

        function getFieldValue(field) {
            var val = null;
            var fileName = Ext.getDom(field);
            if ( fileName ) {
               val = fileName.value;
            }
            return val;
        }

        function toggleInactiveOffset() {
         var inactiveOffset = Ext.getDom('inactiveOffset');
         // If the checkbox is enabled, show the div for termination offset.
         var includeTerminatedEmployees = Ext.getDom('editForm:aggregate_inactive_users');
         if (includeTerminatedEmployees && includeTerminatedEmployees.checked == true) {
              inactiveOffset.style.display = "";
         } else {
              inactiveOffset.style.display = "none";
         }
        }

        Ext.onReady(function () {
           Ext.QuickTips.init();
           toggleInactiveOffset();
           // This is our validation hook
           Page.on('beforeSave', function() {
               if (!hasCredentialConfiguration()) {
                   var host = getFieldValue('editForm:url');
                   Validator.validateNonBlankString(host, "The Oracle HRMS Server URL must be specified!");

                   var user= getFieldValue('editForm:user');
                   Validator.validateNonBlankString(user, "The user that should be used connect to Oracle HRMS Server must be specified!");

                   var pw = getFieldValue('editForm:password');
                   Validator.validateNonBlankString(pw, "User's password must be specified!");

                   var driverClass = getFieldValue('editForm:driverClass');
                   Validator.validateNonBlankString(driverClass, "Driver Class must be specified!");

                   var errors = Validator.getErrors();
                   if (errors && errors.length > 0) {
                       Validator.displayErrors('appErrorsTop');
                       return false;
                   }
               }
               //return false will kill cancel the save
               return true;
           });

        });

       //--><!]]>
    </script>
    <f:view>

      <h:outputText styleClass="sectionHeader" value="#{msgs.oracleHRMS_conn_settings}"/><br/><br/>

      <div id="accountSettings" class='spContent'>
        <table class="spTable" style="border:0px" cellspacing="0">
          <tr>
            <td class='titleColumn certScheduleTitleCol'>
              <h:outputText style='padding:5px' value="#{msgs.connection_user}"/>
              <h:outputText styleClass="requiredText" value="*"/>
            </td>
            <td class="certScheduleHelpCol">
              <h:graphicImage id="imgHlpUser" styleClass="helpIcon"
                              url="/images/icons/dashboard_help_16.png"
                              alt="Connection User"/>
            </td>
            <td>
              <h:inputText value="#{applicationObject.attributes['user']}"
                           id="user"
                           size="20"
                           disabled="#{!sp:hasRight(facesContext, 'ManageApplication')}"
                           readonly="#{!sp:hasRight(facesContext, 'ManageApplication')}"/>
            </td>
          </tr>

          <tr>
            <td class='titleColumn certScheduleTitleCol'>
              <h:outputText style='padding:5px' value="#{msgs.connection_password}"/>
              <h:outputText styleClass="requiredText" value="*"/>
            </td>
            <td class="certScheduleHelpCol">
              <h:graphicImage id="imgHlpPassword" styleClass="helpIcon"
                              url="/images/icons/dashboard_help_16.png"
                              alt="The password of the connection user"/>
            </td>
             <td>
               <sp:inputSecret size="50" 
                               id="password"
                               autocomplete="off"
                               required="false"
                               value="#{applicationObject.attributes['password']}" redisplay="true"
                               disabled="#{!sp:hasRight(facesContext, 'ManageApplication')}"
                               readonly="#{!sp:hasRight(facesContext, 'ManageApplication')}"/> 
             </td>
          </tr>

          <tr>
            <td class='titleColumn certScheduleTitleCol' valign="center">
              <h:outputText style='padding:5px' value="#{msgs.database_url}"/>
              <h:outputText styleClass="requiredText" value="*"/>
            </td>
            <td class="certScheduleHelpCol" valign="middle">
              <h:graphicImage id="imgHlpHostName" styleClass="helpIcon" url="/images/icons/dashboard_help_16.png"
                              alt="URL to the database"/>

            </td>
            <td valign="center">
              <h:inputText id="url"
                           value="#{applicationObject.attributes['url']}"
                           size="80"
                           disabled="#{!sp:hasRight(facesContext, 'ManageApplication')}"
                           readonly="#{!sp:hasRight(facesContext, 'ManageApplication')}"/>
            </td>
          </tr>

          <tr>
            <td class='titleColumn certScheduleTitleCol'>
              <h:outputText style='padding:5px' value="#{msgs.jdbc_driver}"/>
              <h:outputText styleClass="requiredText" value="*"/>
            </td>
            <td class="certScheduleHelpCol">
              <h:graphicImage id="imgHlpDriverClass" styleClass="helpIcon"
                              url="/images/icons/dashboard_help_16.png"
                              alt="JDBC Driver Class"/>
            </td>
            <td>
              <h:inputText id="driverClass"
                           value="#{applicationObject.attributes['driverClass']}"
                           size="80"
                           disabled="#{!sp:hasRight(facesContext, 'ManageApplication')}"
                           readonly="#{!sp:hasRight(facesContext, 'ManageApplication')}"/>
            </td>
          </tr>
          <tr>
            <td class="titleColumn certScheduleTitleCol" valign="center">
              <h:outputText style="padding:5px" value="#{msgs.oracleHRMS_conn_ProxyUser}"/>
            </td>
            <td class="certScheduleHelpCol" valign="middle">
              <h:graphicImage id="imgHlpProxyUser" styleClass="helpIcon" url="/images/icons/dashboard_help_16.png"
                              alt="#{help.help_con_form_OracleHRMS_proxy_user}" />

            </td>
            <td valign="center">
              <h:inputText id="sptProxyHRMSEBSUser"
                           value="#{applicationObject.attributes['sptProxyHRMSEBSUser']}"
                           size="80"
                           disabled="#{!sp:hasRight(facesContext, 'ManageApplication')}"
                           readonly="#{!sp:hasRight(facesContext, 'ManageApplication')}"/>
            </td>
          </tr>

          <tr id='aggregatePersonWithoutSupervisor'>
            <td class='titleColumn certScheduleTitleCol'><h:outputText
                    style='padding:5px'
                    value="#{msgs.oracleHRMS_conn_aggregate_person_without_supervisor}" />
            </td>
            <td class="certScheduleHelpCol" valign="middle"><h:graphicImage
                    id="imgHlpaggregatePersonWithoutSupervisor" styleClass="helpIcon"
                    url="/images/icons/dashboard_help_16.png"
                    alt="#{msgs.help_con_aggregate_person_without_supervisor}" />
            </td>
            <td><h:selectBooleanCheckbox id="aggregate_person_without_supervisor"
                                         value="#{applicationObject.attributes['aggregatePersonWithoutSupervisor']}"
                                         disabled="#{!sp:hasRight(facesContext, 'ManageApplication')}"
                                         readonly="#{!sp:hasRight(facesContext, 'ManageApplication')}" />
            </td>
          </tr>

          <tr id='aggregatePersonsWithoutDefaultUserPersonType'>
            <td class='titleColumn certScheduleTitleCol'><h:outputText
                    style='padding:5px'
                    value="#{msgs.oracleHRMS_conn_aggregate_person_without_default_user_person_type}" />
            </td>
            <td class="certScheduleHelpCol" valign="middle"><h:graphicImage
                    id="imgHlpaggregatePersonsWithoutDefaultUserPersonType" styleClass="helpIcon"
                    url="/images/icons/dashboard_help_16.png"
                    alt="#{msgs.help_con_aggregate_person_without_default_user_person_type}" />
            </td>
            <td><h:selectBooleanCheckbox id="aggregate_person_without_default_user_person_type"
                                         value="#{applicationObject.attributes['aggregatePersonsWithoutDefaultUserPersonType']}"
                                         disabled="#{!sp:hasRight(facesContext, 'ManageApplication')}"
                                         readonly="#{!sp:hasRight(facesContext, 'ManageApplication')}" />
            </td>
          </tr>

          <tr id='inactiveUsers'>
              <td class='titleColumn certScheduleTitleCol'>
                   <h:outputText value="#{msgs.oracleHRMS_conn_aggregate_inactive_users}"/>
              </td>
              <td class="certScheduleHelpCol">
                  <h:graphicImage id="imgHlpAggInactiveEmployees" styleClass="helpIcon"
                                  url="/images/icons/dashboard_help_16.png"
                                  alt="#{help.help_con_aggregate_inactive_users}"/>
              </td>
              <td>
                  <h:selectBooleanCheckbox id="aggregate_inactive_users" onclick='toggleInactiveOffset()' redisplay="true"
                                           value="#{applicationObject.attributes['aggregate_inactive_users']}"
                                           converter="NewLineList"
                                           disabled="#{!sp:hasRight(facesContext, 'ManageApplication')}"
                                           readonly="#{!sp:hasRight(facesContext, 'ManageApplication')}"/>
              </td>
           </tr>
           <tr id='inactiveOffset'>
               <td class='titleColumn certScheduleTitleCol'>
                    <h:outputText style='padding:5px' value="#{msgs.oracleHRMS_conn_inactive_user_offset}"/>
                                       <h:outputText styleClass="requiredText" value="*"/>
               </td>
               <td class="certScheduleHelpCol" valign="middle">
                    <h:graphicImage id="imgHlpinactiveOffset"
                                    styleClass="helpIcon"
                                    url="/images/icons/dashboard_help_16.png"
                                    alt="#{msgs.help_oracleHRMS_conn_inactive_user_offset}"/>
               </td>
               <td>
                    <h:inputText   value="#{applicationObject.attributes['inactiveOffset']}"
                                   size="10"
                                   id="inactiveOffset"
                                   disabled="#{!sp:hasRight(facesContext, 'ManageApplication')}"
                                   readonly="#{!sp:hasRight(facesContext, 'ManageApplication')}">
                    </h:inputText>
                    <br/>
               </td>
          </tr>

          <tr>
           <td class="titleColumn certScheduleTitleCol" >
              <h:outputText style='padding:5px' value="#{msgs.con_form_delimited_buildMap}"/>
           </td>
           <td class="certScheduleHelpCol">
              <h:graphicImage id="imgHlpSAPBuildMap"
                   styleClass="helpIcon" url="/images/icons/dashboard_help_16.png"
                   alt="#{msgs.con_help_delimited_buildMap}"/>
           </td>
            <td>
              <h:selectOneMenu id="JDBCBuildMapRule" style="width:500px"
                   value="#{applicationObject.attributes['buildMapRule']}"
                   disabled="#{!sp:hasRight(facesContext, 'ManageApplication')}"
                   readonly="#{!sp:hasRight(facesContext, 'ManageApplication')}">
               <f:selectItems value="#{applicationObject.JDBCBuildMapRules}" />
              </h:selectOneMenu>
            </td>
          </tr>
        </table>
      </div>


    </f:view>
</ui:composition>

</body>
</html>
