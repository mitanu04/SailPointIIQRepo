<html xmlns="http://www.w3.org/1999/xhtml"

<body>

<ui:composition>

    <script type="text/javascript">
      <!--//--><![CDATA[//><!--
      helpKey = 'APPLICATION';

      function getFieldValue(fieldname) {
          var val = null;
          var field = Ext.getDom(fieldname);
          if ( field ) {
              val = field.value;
          }
          return val;
      }

 function showAccountFilter() {
        	
            if(document.getElementById("editForm:excludeProviderbyStatus").checked == true){
                 document.getElementById('ProviderbyStatus').style.display = '';
            } else {
                 document.getElementById('ProviderbyStatus').style.display = 'none';
            }
        }
		
		
 function showcustomFilter() {
        	
            if(document.getElementById("editForm:excludeProviderbyCustomCriteria").checked == true){
                 document.getElementById('customFilter').style.display = '';
            } else {
                 document.getElementById('customFilter').style.display = 'none';
            }
        }
		
		
      Ext.onReady(function () {
          Ext.QuickTips.init();
		  showAccountFilter();
		  showcustomFilter();
          // This is our validation hook
          Page.on('beforeSave', function() {
              if (!hasCredentialConfiguration()) {
                  var accessKey = getFieldValue('editForm:accessKey');
                  Validator.validateNonBlankString(host, "Access key cannot be null!");

                  var clientId = getFieldValue('editForm:clientId');
                  Validator.validateNonBlankString(clientId, "Client Id cannot be null!");

                  var clientSecret = getFieldValue('editForm:clientSecret');
                  Validator.validateNonBlankString(clientSecret, "Client Secret cannot be null!");

                  var errors = Validator.getErrors();
                  if (errors && errors.length > 0) {
                      Validator.displayErrors('appErrorsTop');
                      return false;
                  }
              }

              return true;
          });
      });

      //--><!]]>
    </script>
    <f:view>

    <h:outputText styleClass="sectionHeader" value="#{applicationObject.type} Connection Credentials"/><br/><br/>


    <div id="accountSettings" class='spContent'>
      <table class="spTable" style="border:0px" cellspacing="0">
        <tr>
          <td class='titleColumn certScheduleTitleCol'>
            <h:outputText style='padding:5px' value="#{msgs.con_form_verityStream_Access_key}"/>
            <h:outputText styleClass="requiredText" value="*"/>
          </td>
          <td class="certScheduleHelpCol">
            <h:graphicImage id="imgHlpUrl" 
                            styleClass="helpIcon" 
                            url="/images/icons/dashboard_help_16.png" 
                            alt="#{help.help_con_form_verityStream_Access_key}"/>
          </td>
          <td>
            <h:inputText id="accessKey"
                         value="#{applicationObject.attributes['accessKey']}"
                         size="40"
                         disabled="#{!sp:hasRight(facesContext, 'ManageApplication')}"
                         readonly="#{!sp:hasRight(facesContext, 'ManageApplication')}"/>
          </td>
        </tr>
        <tr>
          <td class='titleColumn certScheduleTitleCol'>
            <h:outputText style='padding:5px' value="#{msgs.con_form_verityStream_ClientId}"/>
            <h:outputText styleClass="requiredText" value="*"/>
          </td>
          <td class="certScheduleHelpCol">
            <h:graphicImage id="imgHlpUser" 
                            styleClass="helpIcon" 
                            url="/images/icons/dashboard_help_16.png" 
                            alt="#{help.help_con_form_verityStream_ClientId}"/>
          </td>
          <td>
            <h:inputText id="clientId"
                         value="#{applicationObject.attributes['clientId']}"
                         size="40"
                         disabled="#{!sp:hasRight(facesContext, 'ManageApplication')}"
                         readonly="#{!sp:hasRight(facesContext, 'ManageApplication')}"/>
          </td>
        </tr>
        <tr>
          <td class='titleColumn certScheduleTitleCol'>
            <h:outputText style='padding:5px' value="#{msgs.con_form_verityStream_ClientSecret}"/>
            <h:outputText styleClass="requiredText" value="*"/>
          </td>
          <td class="certScheduleHelpCol">
            <h:graphicImage id="imgHlpPassword" 
                            styleClass="helpIcon" 
                            url="/images/icons/dashboard_help_16.png" 
                            alt="#{help.help_con_form_verityStream_ClientSecret}"/>
          </td>
          <td>
            <sp:inputSecret id="clientSecret"
                            value="#{applicationObject.attributes['clientSecret']}"
                            size="40"
                            redisplay="true"
                            autocomplete="off"
                            disabled="#{!sp:hasRight(facesContext, 'ManageApplication')}"
                            readonly="#{!sp:hasRight(facesContext, 'ManageApplication')}"/>
          </td>
        </tr>
		
		 <tr>
            <td class='titleColumn certScheduleTitleCol'>
              <h:outputText style='padding:5px' value="#{msgs.con_form_verityStream_PageSize}"/>
            </td>
            <td class="certScheduleHelpCol">
              <h:graphicImage id="imgHlpChunkSize" styleClass="helpIcon" url="/images/icons/dashboard_help_16.png" 
                              alt="#{help.help_con_form_verityStream_PageSize}"/>
            </td>
            <td>
              <h:inputText id="pageSize"
                           value="#{applicationObject.attributes['pageSize']}"                              
                           size="3"
                           disabled="#{!sp:hasRight(facesContext, 'ManageApplication')}"                          
                           readonly="#{!sp:hasRight(facesContext, 'ManageApplication')}">
                           <f:validateLongRange minimum="1" maximum="1000"/>
              </h:inputText>
            </td>
          </tr>
		
       
      </table>
    </div>
	
	<div id="filterCriteria" class='spContent'>
                   <br />

            <table class="spTable" style="border: 0px" cellspacing="0">
     
            <tr>

                <h:outputText  value="#{msgs.con_form_verityStream_excludeProviderbyStatus}" />

            <td class="certScheduleHelpCol">

            </td>
            <td>
                <h:selectBooleanCheckbox id="excludeProviderbyStatus"

                  value="#{applicationObject.attributes['excludeProviderbyStatus']}" />
            </td>
          </tr>		  
		       
		        
        </table>
      </div>

		      <tr>

</ui:composition>
