<html xmlns:ui="http://java.sun.com/jsf/facelets"
      xmlns:f="http://java.sun.com/jsf/core"
      xmlns:h="http://java.sun.com/jsf/html"
      xmlns:t="http://myfaces.apache.org/tomahawk"
      xmlns:p="http://primefaces.org/ui"
      xmlns:sp="http://sailpoint.com/ui"
      xmlns="http://www.w3.org/1999/xhtml">
<body>
<ui:composition>
    <script type="text/javascript">
        <!--//--><![CDATA[//><!--
        helpKey = 'APPLICATION';

        function getFieldValue(field) {
            var val = null;
            var fileName = Ext.getDom(field);
            if (fileName) {
                val = fileName.value;
            }
            return val;
        }
    
        Ext.onReady(function () {
            Ext.QuickTips.init();
            //Account Type Selection

            //This is the validation hook
            Page.on('beforeSave', function () {
                if (!hasCredentialConfiguration()) {
                    var baseURL = getFieldValue('editForm:scim0_host');
                    Validator.validateNonBlankString(baseURL, "The Host URL must be specified!");

                    var TokenURL = getFieldValue('editForm:scim0_token_url');
                    Validator.validateNonBlankString(TokenURL, "The Token URL must be specified!");

                    var clientId = getFieldValue('editForm:scim0_client_id');
                    Validator.validateNonBlankString(clientId, "The Client Id must be specified!");

                    var clientSecret = getFieldValue('editForm:scim0_client_secret');
                    Validator.validateNonBlankString(clientSecret, "The Client Secret must be specified!");

                    var errors = Validator.getErrors();
                    if (errors && errors.length > 0) {
                        Validator.displayErrors('appErrorsTop');
                        return false;
                    }
                }
                //return false will cancel the save
                return true;
            });
        });
        //--><!]]>
    </script>
    <f:view>
        <h:outputText styleClass="sectionHeader" value="#{msgs.con_form_sap_btp_connection_settings}"/>
        <br/>
        <ui:fragment>      
                <table class="spTable" style="border: 0px" cellspacing="0" valign="left">                 
                    <tr>
                        <td class='titleColumn certScheduleTitleCol' >
                            <h:outputText style='padding:5px' value="#{msgs.con_form_sap_btp_account_type}" />
                            <h:outputText styleClass="requiredText" value="*"/>
                        </td>
                        <td class="certScheduleHelpCol" valign="left">
                            <h:graphicImage id="imgHlpGetAccountType"
                                            styleClass="helpIcon"
                                            url="/images/icons/dashboard_help_16.png"
                                            alt="#{help.help_con_form_sap_btp_account_type}" />
                        </td>
                        <td>
                            <h:selectOneRadio id="accountType"
                                              value="#{applicationObject.attributes['accountType']}"
                                              disabled="#{!sp:hasRight(facesContext, 'ManageApplication')}"
                                              readonly="#{!sp:hasRight(facesContext, 'ManageApplication')}"
                                              layout="pageDirection">
                                <f:selectItem itemLabel="#{msgs.con_form_sap_btp_global_account}" itemValue="Global Account"  />
                                <f:selectItem itemLabel="#{msgs.con_form_sap_btp_directory}" itemValue="Directory" />
                                <f:selectItem itemLabel="#{msgs.con_form_sap_btp_sub_account}" itemValue="Sub-Account"  />
                            </h:selectOneRadio>
                        </td>
                    </tr> 
                </table>
         </ui:fragment>
        <br/>
        <div id="accountSettings" class='spContent'>
            <!-- BTP Connection Settings-->
            <div class='spContent' id="scimAPISettings">
                <table class="spTable" style="border: 0px" cellspacing="0">
                    <tr>
                        <td class='titleColumn certScheduleTitleCol' valign="center">
                            <h:outputText style='padding:5px' value="#{msgs.con_form_sap_btp_base_url}"/>
                            <h:outputText styleClass="requiredText" value="*"/>
                        </td>
                        <td class="certScheduleHelpCol" valign="middle">
                            <h:graphicImage
                                id="imgHlpApplicationUrl" styleClass="helpIcon"
                                url="/images/icons/dashboard_help_16.png"
                                alt="#{help.help_con_form_sap_btp_base_url}"/>
                        </td>
                        <td>
                            <h:inputText id="scim0_host"
                                         value="#{applicationObject.attributes['scim0_host']}"
                                         size="100"
                                         disabled="#{!sp:hasRight(facesContext, 'ManageApplication')}"
                                         readonly="#{!sp:hasRight(facesContext, 'ManageApplication')}"/>
                        </td>
                    </tr>

                    <tr>
                        <td class='titleColumn certScheduleTitleCol' valign="center">
                            <h:outputText style='padding:5px' value="#{msgs.con_form_sap_btp_token_url}"/>
                            <h:outputText styleClass="requiredText" value="*"/>
                        </td>
                        <td class="certScheduleHelpCol" valign="middle">
                            <h:graphicImage
                                id="imgHlpTokenUrl" styleClass="helpIcon"
                                url="/images/icons/dashboard_help_16.png"
                                alt="#{help.help_con_form_sap_btp_token_url}"/>
                        </td>
                        <td>
                            <h:inputText id="scim0_token_url"
                                         value="#{applicationObject.attributes['scim0_token_url']}"
                                         size="100"
                                         disabled="#{!sp:hasRight(facesContext, 'ManageApplication')}"
                                         readonly="#{!sp:hasRight(facesContext, 'ManageApplication')}"/>
                        </td>
                    </tr>

                    <tr>
                        <td class='titleColumn certScheduleTitleCol'>
                            <h:outputText
                                style='padding:5px'
                                value="#{msgs.con_form_sap_btp_authentication_method}"/>
                            <h:outputText
                                styleClass="requiredText" value="*"/>
                        </td>
                        <td class="certScheduleHelpCol">
                            <h:graphicImage
                                id="imgHlpAuthenticationMethod" styleClass="helpIcon"
                                url="/images/icons/dashboard_help_16.png"
                                alt="#{help.help_con_form_sap_btp_authentication_method}"/>
                        </td>
                        <td>
                            <h:selectOneMenu id="scim0_authType"
                                             value="#{applicationObject.attributes['scim0_authType']}"
                                             disabled="#{!sp:hasRight(facesContext, 'ManageApplication')}"
                                             readonly="#{!sp:hasRight(facesContext, 'ManageApplication')}">
                                <f:selectItem itemValue="OAuth2Login" itemLabel="OAuth 2.0"/>
                            </h:selectOneMenu>
                        </td>
                    </tr>

                    <tr>
                        <td class='titleColumn certScheduleTitleCol'>
                            <h:outputText
                                style='padding:5px'
                                value="#{msgs.con_form_sap_btp_grant_type}"/>
                            <h:outputText
                                styleClass="requiredText" value="*"/>
                        </td>
                        <td class="certScheduleHelpCol">
                            <h:graphicImage
                                id="imgHlpGrantType" styleClass="helpIcon"
                                url="/images/icons/dashboard_help_16.png"
                                alt="#{help.help_con_form_sap_btp_grant_type}"/>
                        </td>
                        <td>
                            <h:selectOneMenu id="scim0_grant_type"
                                             value="#{applicationObject.attributes['scim0_grant_type']}"
                                             disabled="#{!sp:hasRight(facesContext, 'ManageApplication')}"
                                             readonly="#{!sp:hasRight(facesContext, 'ManageApplication')}">
                                <f:selectItem itemValue="client_credentials" itemLabel="Client Credentials"/>
                            </h:selectOneMenu>
                        </td>
                    </tr>


                    <tr>
                        <td class='titleColumn certScheduleTitleCol' valign="center">
                            <h:outputText style='padding:5px' value="#{msgs.con_form_sap_btp_client_id}"/>
                            <h:outputText styleClass="requiredText" value="*"/>
                        </td>
                        <td class="certScheduleHelpCol" valign="middle">
                            <h:graphicImage
                                id="imgHlpClientId" styleClass="helpIcon"
                                url="/images/icons/dashboard_help_16.png"
                                alt="#{help.help_con_form_sap_btp_user}"/>
                        </td>
                        <td>
                            <h:inputText id="scim0_client_id"
                                         value="#{applicationObject.attributes['scim0_client_id']}"
                                         disabled="#{!sp:hasRight(facesContext, 'ManageApplication')}"
                                         readonly="#{!sp:hasRight(facesContext, 'ManageApplication')}"/>
                        </td>
                    </tr>

                    <tr>
                        <td class='titleColumn certScheduleTitleCol' valign="center">
                            <h:outputText style='padding:5px' value="#{msgs.con_form_sap_btp_client_secret}"/>
                            <h:outputText styleClass="requiredText" value="*"/>
                        </td>
                        <td class="certScheduleHelpCol" valign="middle">
                            <h:graphicImage
                                id="imgHlpClientSecret" styleClass="helpIcon"
                                url="/images/icons/dashboard_help_16.png"
                                alt="#{help.help_con_form_sap_btp_password}"/>
                        </td>
                        <td>
                            <sp:inputSecret id="scim0_client_secret"
                                            value="#{applicationObject.attributes['scim0_client_secret']}"
                                            redisplay="true" autocomplete="off"
                                            disabled="#{!sp:hasRight(facesContext, 'ManageApplication')}"
                                            readonly="#{!sp:hasRight(facesContext, 'ManageApplication')}"/>
                        </td>
                    </tr>
                </table>

            </div>

            <!--Page Size Settings-->
            <div class="" id="pageSizeSettings">
                <br/>
                <h:outputText styleClass="sectionHeader" value="#{msgs.con_form_sap_btp_page_size_settings}"/>
                <br/>
                <table class="spTable" style="border: 0px" cellspacing="0">
                    <tr id="pageSizeTr">
                        <td class='titleColumn certScheduleTitleCol'>
                            <h:outputText style='padding:5px' value="#{msgs.con_form_sap_btp_page_size}"/>
                            <h:outputText/>
                        </td>
                        <td class="certScheduleHelpCol">
                            <h:graphicImage
                                id="imgHlpPageSize" styleClass="helpIcon"
                                url="/images/icons/dashboard_help_16.png"
                                alt="#{help.help_con_form_sap_btp_page_size_settings}"/>
                        </td>
                        <td>
                            <sp:inputText id="pageSize"
                                          value="#{applicationObject.attributes['pageSize']}"
                                          size="20"
                                          disabled="#{!sp:hasRight(facesContext, 'ManageApplication')}"
                                          readonly="#{!sp:hasRight(facesContext, 'ManageApplication')}">
                                <f:validateLongRange minimum="10" maximum="500"/>
                            </sp:inputText>
                        </td>
                    </tr>
                </table>
            </div>
        </div>
    </f:view>
</ui:composition>
</body>
</html>
