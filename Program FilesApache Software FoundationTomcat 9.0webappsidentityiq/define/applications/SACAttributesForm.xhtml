<html xmlns:ui="http://java.sun.com/jsf/facelets"
      xmlns:f="http://java.sun.com/jsf/core"
      xmlns:h="http://java.sun.com/jsf/html"
      xmlns:t="http://myfaces.apache.org/tomahawk"
      xmlns:p="http://primefaces.org/ui"
      xmlns:sp="http://sailpoint.com/ui"
      xmlns="http://www.w3.org/1999/xhtml">
<body>
<ui:composition>
    <script type="text/javascript">
        <!--//--><![CDATA[//><!--
        helpKey = 'APPLICATION';

        function getFieldValue(field) {
            var val = null;
            var fileName = Ext.getDom(field);
            if (fileName) {
                val = fileName.value;
            }
            return val;
        }

        Ext.onReady(function () {
            Page.on('beforeSave', function () {
                if (!hasCredentialConfiguration()) {
                    var host = getFieldValue('editForm:ips0_host');
                    Validator.validateNonBlankString(host, "The SAP IPS Host URL must be specified!");

                    var userName = getFieldValue('editForm:ips0_user');
                    Validator.validateNonBlankString(userName, "The Client ID must be specified!");

                    var password = getFieldValue('editForm:ips0_password');
                    Validator.validateNonBlankString(password, "The Client Secret must be specified!");

                    var proxySysId = getFieldValue('editForm:ips0_proxySystemId');
                    Validator.validateNonBlankString(proxySysId, "The SAP IPS Proxy System ID must be specified!");

                    var errors = Validator.getErrors();
                    if (errors && errors.length > 0) {
                        Validator.displayErrors('appErrorsTop');
                        return false;
                    }
                }
                //return false will cancel the save
                return true;
            });
        });
        //--><!]]>
    </script>
    <f:view>
        <h:outputText styleClass="sectionHeader" value="#{msgs.con_form_sac_connection_settings}"/>
        <br/>
        <br/>
        <div id="accountSettings" class='spContent'>
            <div class="" id="ipsConnSettings">
                <h:outputText styleClass="sectionHeader" value="#{msgs.con_form_sac_ips_connection_settings}"/>
                <br/>
                <!-- SAP IPS Connection Settings-->
                <table class="spTable" style="border: 0px" cellspacing="0">
                    <tr>
                        <td class='titleColumn certScheduleTitleCol' valign="center">
                            <h:outputText style='padding:5px' value="#{msgs.con_form_sac_ips_proxy_host}"/>
                            <h:outputText styleClass="requiredText" value="*"/>
                        </td>
                        <td class="certScheduleHelpCol" valign="middle">
                            <h:graphicImage
                                    id="imgHlpIpsHost" styleClass="helpIcon"
                                    url="/images/icons/dashboard_help_16.png"
                                    alt="#{help.help_con_form_sac_ips_proxy_host}"/>
                        </td>
                        <td>
                            <h:inputText id="ips0_host"
                                         value="#{applicationObject.attributes['ips0_host']}"
                                         size="40"
                                         disabled="#{!sp:hasRight(facesContext, 'ManageApplication')}"
                                         readonly="#{!sp:hasRight(facesContext, 'ManageApplication')}"/>
                        </td>
                    </tr>
                    <tr>
                        <td class='titleColumn certScheduleTitleCol' valign="center">
                            <h:outputText style='padding:5px' value="#{msgs.con_form_sac_ips_proxy_system_id}"/>
                            <h:outputText styleClass="requiredText" value="*"/>
                        </td>
                        <td class="certScheduleHelpCol" valign="middle">
                            <h:graphicImage
                                    id="imgHlpIpsProxySystemId" styleClass="helpIcon"
                                    url="/images/icons/dashboard_help_16.png"
                                    alt="#{help.help_con_form_sac_ips_proxy_system_id}"/>
                        </td>
                        <td>
                            <h:inputText id="ips0_proxySystemId"
                                         value="#{applicationObject.attributes['ips0_proxySystemId']}"
                                         size="40"
                                         disabled="#{!sp:hasRight(facesContext, 'ManageApplication')}"
                                         readonly="#{!sp:hasRight(facesContext, 'ManageApplication')}"/>
                        </td>
                    </tr>
                    <tr>
                        <td class='titleColumn certScheduleTitleCol' valign="center">
                            <h:outputText style='padding:5px' value="#{msgs.con_form_sac_ips_client_id}"/>
                            <h:outputText styleClass="requiredText" value="*"/>
                        </td>
                        <td class="certScheduleHelpCol" valign="middle">
                            <h:graphicImage
                                    id="imgHlpIpsUser" styleClass="helpIcon"
                                    url="/images/icons/dashboard_help_16.png"
                                    alt="#{help.help_con_form_sac_ips_client_id}"/>
                        </td>
                        <td>
                            <h:inputText id="ips0_user"
                                         value="#{applicationObject.attributes['ips0_user']}"
                                         size="40"
                                         disabled="#{!sp:hasRight(facesContext, 'ManageApplication')}"
                                         readonly="#{!sp:hasRight(facesContext, 'ManageApplication')}"/>
                        </td>
                    </tr>
                    <tr>
                        <td class='titleColumn certScheduleTitleCol'>
                            <h:outputText
                                    style='padding:5px'
                                    value="#{msgs.con_form_sac_ips_client_secret}"/>
                            <h:outputText
                                    styleClass="requiredText" value="*"/>
                        </td>
                        <td class="certScheduleHelpCol">
                            <h:graphicImage
                                    id="imgHlpIpsPassword" styleClass="helpIcon"
                                    url="/images/icons/dashboard_help_16.png"
                                    alt="#{help.help_con_form_sac_ips_client_secret}"/>
                        </td>
                        <td>
                            <sp:inputSecret id="ips0_password"
                                            value="#{applicationObject.attributes['ips0_password']}"
                                            size="20"
                                            redisplay="true" autocomplete="off"
                                            disabled="#{!sp:hasRight(facesContext, 'ManageApplication')}"
                                            readonly="#{!sp:hasRight(facesContext, 'ManageApplication')}"/>
                        </td>
                    </tr>
                </table>
            </div>
            <!--Page Size Settings-->
            <br/>
            <h:outputText styleClass="sectionHeader" value="#{msgs.con_form_sac_page_size_settings}"/>
            <br/>
            <table class="spTable" style="border: 0px" cellspacing="0">
                <tr id="pageSizeTr">
                    <td class='titleColumn certScheduleTitleCol'>
                        <h:outputText style='padding:5px' value="#{msgs.con_form_sac_page_size}"/>
                        <h:outputText/>
                    </td>
                    <td class="certScheduleHelpCol">
                        <h:graphicImage
                                id="imgHlpPageSize" styleClass="helpIcon"
                                url="/images/icons/dashboard_help_16.png"
                                alt="#{help.help_con_form_sac_page_size_settings}"/>
                    </td>
                    <td>
                        <sp:inputText id="pageSize"
                                      value="#{applicationObject.attributes['pageSize']}"
                                      size="20"
                                      disabled="#{!sp:hasRight(facesContext, 'ManageApplication')}"
                                      readonly="#{!sp:hasRight(facesContext, 'ManageApplication')}">
                            <f:validateLongRange minimum="1" maximum="100" />
                        </sp:inputText>
                    </td>
                </tr>
            </table>
        </div>
    </f:view>
</ui:composition>
</body>
</html>
