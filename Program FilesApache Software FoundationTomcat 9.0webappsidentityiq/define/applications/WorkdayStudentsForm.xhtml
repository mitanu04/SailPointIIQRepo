<html xmlns:ui="http://java.sun.com/jsf/facelets"
      xmlns:f="http://java.sun.com/jsf/core"
      xmlns:h="http://java.sun.com/jsf/html"
      xmlns:t="http://myfaces.apache.org/tomahawk"
      xmlns:sp="http://sailpoint.com/ui"
      xmlns="http://www.w3.org/1999/xhtml">
<body>

<ui:composition>
    <script type="text/javascript">
        <!--//--><![CDATA[//><!--
        helpKey = 'APPLICATION';
        

        function getFieldValue(field) {
            var val = null;
            var fileName = Ext.getDom(field);
            if ( fileName ) {
                val = fileName.value;
            }
            return val;
        }

        function toggleCredentials(auth_type) {
            if (auth_type == "") {
                auth_type = "OAuth2";
                var radioInputs = Ext.getDom(document.getElementsByName('editForm:auth_type'));
                radioInputs.item(0).checked = true;
            }
        }
        
        Ext.onReady(function () {
            toggleCredentials("#{applicationObject.attributes['auth_type']}");
            Ext.QuickTips.init();
            // This is our validation hook
            Page.on('beforeSave', function() {
                if (!hasCredentialConfiguration()) {
                    var radioInputsAuth = Ext.getDom(document.getElementsByName('editForm:auth_type'));
                    var authType;
                    if (radioInputsAuth.item(0).checked) {
                        authType = "OAuth2";
                    }

                    var host = getFieldValue('editForm:url');
                    Validator.validateNonBlankString(host, "#{msgs.err_workday_student_missing_url}");

                    var user= getFieldValue('editForm:user');
                    var pw = getFieldValue('editForm:password');

                    if (authType == "OAuth2") {
                        var tokenEp = getFieldValue('editForm:tokenEndpoint');
                        Validator.validateNonBlankString(tokenEp, "#{msgs.err_workday_student_missing_token_endpoint}");
                        var clientId = getFieldValue('editForm:clientId');
                        Validator.validateNonBlankString(clientId, "#{msgs.err_workday_student_missing_clientId}");
                        var clientSecret = getFieldValue('editForm:clientSecret');
                        Validator.validateNonBlankString(clientSecret, "#{msgs.err_workday_student_missing_clientSecret}");
                        var refreshToken = getFieldValue('editForm:refreshToken');
                        Validator.validateNonBlankString(refreshToken, "#{msgs.err_workday_student_missing_refreshToken}");
                    }
					
					var academicUnitID = getFieldValue('editForm:academicUnitID');
                    Validator.validateNonBlankString(academicUnitID, "#{msgs.err_workday_student_missing_academic_unit_id}");

                    var errors = Validator.getErrors();
                    if (errors && errors.length > 0) {
                        Validator.displayErrors('appErrorsTop');
                        return false;
                    }
                }
                //return false will kill cancel the save
                return true;
            });
        });
        //--><!]]>
    </script>

    <f:view>
        <h:outputText styleClass="sectionHeader" value="#{msgs.con_form_workday_student_config}"/>
        <br/>

        <div id="accountSettings" class='spContent'>
            <table class="spTable" style="border:0px" cellspacing="0">

                <tr id="workdayAuthDiv">
                    <td class='titleColumn certScheduleTitleCol'>
                        <h:outputText style='padding:5px' value="#{msgs.con_form_workday_student_auth_type}"/>
                    </td>
                    <td class="certScheduleHelpCol">
                        <h:graphicImage id="imgHlpAuthType"
                                        styleClass="helpIcon"
                                        url="/images/icons/dashboard_help_16.png"
                                        alt="#{help.help_con_form_workday_student_auth_type}"/>
                    </td>
                    <td>
                        <h:selectOneRadio id="auth_type" redisplay="true"
                                          value="#{applicationObject.attributes['auth_type']}"
                                          disabled="#{!sp:hasRight(facesContext, 'ManageApplication')}"
                                          readonly="#{!sp:hasRight(facesContext, 'ManageApplication')}"
                                          layout="pageDirection">
                            <f:selectItem itemValue="OAuth2"
                                          itemLabel="#{msgs.con_form_workday_student_auth_type_oauth2}"/>
                        </h:selectOneRadio>
                    </td>
                </tr>

                <tr id="grantTypeTr">
                    <td class='titleColumn certScheduleTitleCol'>
                        <h:outputText style='padding:5px' value="#{msgs.con_form_workday_student_grant_type}"/>
                        <h:outputText/>
                    </td>
                    <td class="certScheduleHelpCol">
                        <h:graphicImage id="imgHlpGrantType" styleClass="helpIcon"
                                        url="/images/icons/dashboard_help_16.png"
                                        alt="#{msgs.help_con_form_workday_student_grant_type}"/>
                    </td>
                    <td>
                        <h:selectOneMenu style="height: 30px !important;line-height: 26px;
                                vertical-align: middle !important;border: 1px solid #b5b8c8;
                                width: 300px;" id="grant_type"
                                         value="#{applicationObject.attributes['grant_type']}"
                                         disabled="#{!sp:hasRight(facesContext, 'ManageApplication')}"
                                         readonly="#{!sp:hasRight(facesContext, 'ManageApplication')}">
                            <f:selectItem itemValue="REFRESH_TOKEN"
                                          itemLabel="#{msgs.con_form_workday_student_grant_type_refresh_token}"/>
                        </h:selectOneMenu>
                    </td>
                </tr>
                <tr id="urlTr">
                    <td class='titleColumn certScheduleTitleCol' valign="center">
                        <h:outputText style='padding:5px' value="#{msgs.con_form_workday_student_url}"/>
                        <h:outputText styleClass="requiredText" value="*"/>
                    </td>
                    <td class="certScheduleHelpCol" valign="middle">
                        <h:graphicImage id="imgHlpHostName" styleClass="helpIcon"
                                        url="/images/icons/dashboard_help_16.png"
                                        alt="#{help.help_con_form_workday_student_url}"/>
                    </td>
                    <td valign="center">
                        <h:inputText id="url"
                                     value="#{applicationObject.attributes['url']}"
                                     size="120"
                                     disabled="#{!sp:hasRight(facesContext, 'ManageApplication')}"
                                     readonly="#{!sp:hasRight(facesContext, 'ManageApplication')}"/>
                    </td>
                </tr>
            </table>

            <table class="spTable" style="border: 0px" cellspacing="0">

                <tr id="tokenEndpointTr">
                    <td class='titleColumn certScheduleTitleCol'>
                        <h:outputText
                                style='padding:5px'
                                value="#{msgs.con_form_workday_student_token_endpoint}"/>
                        <h:outputText
                                styleClass="requiredText" value="*"/>
                    </td>

                    <td class="certScheduleHelpCol">
                        <h:graphicImage
                                id="imgHlpTokenEp" styleClass="helpIcon"
                                url="/images/icons/dashboard_help_16.png"
                                alt="#{help.help_con_form_workday_student_tokenEndpoint}"/>
                    </td>

                    <td>
                        <h:inputText
                                value="#{applicationObject.attributes['token_url']}"
                                id="tokenEndpoint" size="120"
                                disabled="#{!sp:hasRight(facesContext, 'ManageApplication')}"
                                readonly="#{!sp:hasRight(facesContext, 'ManageApplication')}"/>
                    </td>
                </tr>

                <tr id="clientIdTr">
                    <td class='titleColumn certScheduleTitleCol'>
                        <h:outputText
                                style='padding:5px' value="#{msgs.con_form_workday_student_clientId}"/>
                        <h:outputText
                                styleClass="requiredText" value="*"/>
                    </td>

                    <td class="certScheduleHelpCol">
                        <h:graphicImage
                                id="imgHlpClientId" styleClass="helpIcon"
                                url="/images/icons/dashboard_help_16.png"
                                alt="#{help.help_con_form_workday_student_clientId}"/>
                    </td>

                    <td>
                        <h:inputText
                                value="#{applicationObject.attributes['client_id']}"
                                id="clientId" size="120"
                                disabled="#{!sp:hasRight(facesContext, 'ManageApplication')}"
                                readonly="#{!sp:hasRight(facesContext, 'ManageApplication')}"/>
                    </td>
                </tr>

                <tr id="clientSecretTr">
                    <td class='titleColumn certScheduleTitleCol'>
                        <h:outputText
                                style='padding:5px'
                                value="#{msgs.con_form_workday_student_clientSecret}"/>
                        <h:outputText
                                styleClass="requiredText" value="*"/>
                    </td>
                    <td class="certScheduleHelpCol">
                        <h:graphicImage
                                id="imgHlpClientSecret" styleClass="helpIcon"
                                url="/images/icons/dashboard_help_16.png"
                                alt="#{help.help_con_form_workday_student_clientSecret}"/>
                    </td>
                    <td>
                        <sp:inputSecret id="clientSecret"
                                        value="#{applicationObject.attributes['client_secret']}"
                                        size="120" redisplay="true" autocomplete="off"
                                        disabled="#{!sp:hasRight(facesContext, 'ManageApplication')}"
                                        readonly="#{!sp:hasRight(facesContext, 'ManageApplication')}"/>
                    </td>
                </tr>

                <tr id="refreshTokenTr">
                    <td class='titleColumn certScheduleTitleCol'>
                        <h:outputText
                                style='padding:5px'
                                value="#{msgs.con_form_workday_student_refreshToken}"/>
                        <h:outputText
                                styleClass="requiredText" value="*"/>
                    </td>
                    <td class="certScheduleHelpCol">
                        <h:graphicImage
                                id="imgHlpRefreshToken" styleClass="helpIcon"
                                url="/images/icons/dashboard_help_16.png"
                                alt="#{help.help_con_form_workday_student_refreshToken}"/>
                    </td>
                    <td>
                        <sp:inputSecret id="refreshToken"
                                        value="#{applicationObject.attributes['refresh_token']}"
                                        size="120" redisplay="true" autocomplete="off"
                                        disabled="#{!sp:hasRight(facesContext, 'ManageApplication')}"
                                        readonly="#{!sp:hasRight(facesContext, 'ManageApplication')}"/>
                    </td>
                </tr>
            </table>

            <table class="spTable" style="border:0px" cellspacing="0">
                <tr>
                    <td class='titleColumn certScheduleTitleCol'>
                        <h:outputText style='padding:5px' value="#{msgs.con_form_workday_student_academic_unit_id}"/>
                        <h:outputText styleClass="requiredText" value="*"/>
                    </td>
                    <td class="certScheduleHelpCol">
                        <h:graphicImage id="imgHlpacademicUnitID" styleClass="helpIcon"
                                        url="/images/icons/dashboard_help_16.png"
                                        alt="#{help.help_con_form_workday_student_academic_unit_id}"/>
                    </td>
                    <td>
                        <h:inputText id="academicUnitID"
                                     value="#{applicationObject.attributes['academicUnitID']}"
                                     size="3"
                                     disabled="#{!sp:hasRight(facesContext, 'ManageApplication')}"
                                     readonly="#{!sp:hasRight(facesContext, 'ManageApplication')}">
                        </h:inputText>
                    </td>
                </tr>
                
                <tr>
                    <td class='titleColumn certScheduleTitleCol'>
                        <h:outputText style='padding:5px' value="#{msgs.con_form_workday_student_page_size}"/>
                    </td>
                    <td class="certScheduleHelpCol">
                        <h:graphicImage id="imgHlpPageSize" styleClass="helpIcon"
                                        url="/images/icons/dashboard_help_16.png"
                                        alt="#{help.help_con_form_workday_student_page_size}"/>
                    </td>
                    <td>
                        <h:inputText id="pageSize"
                                     value="#{applicationObject.attributes['pageSize']}"
                                     size="3"
                                     disabled="#{!sp:hasRight(facesContext, 'ManageApplication')}"
                                     readonly="#{!sp:hasRight(facesContext, 'ManageApplication')}">
                            <f:validateLongRange minimum="1" maximum="999"/>
                        </h:inputText>
                    </td>
                </tr>

                <tr>
                    <td class='titleColumn certScheduleTitleCol'>
                        <h:outputText style='padding:5px' value="#{msgs.con_form_workday_student_connection_timeout}"/>
                    </td>
                    <td class="certScheduleHelpCol">
                        <h:graphicImage id="imgHlpCustomTimeOut" styleClass="helpIcon"
                                        url="/images/icons/dashboard_help_16.png"
                                        alt="#{help.help_con_form_workday_student_connection_timeout}"/>
                    </td>
                    <td>
                        <h:inputText id="customTimeOut"
                                     value="#{applicationObject.attributes['customTimeOut']}"
                                     size="3"
                                     disabled="#{!sp:hasRight(facesContext, 'ManageApplication')}"
                                     readonly="#{!sp:hasRight(facesContext, 'ManageApplication')}">
                        </h:inputText>
                    </td>
                </tr>
            </table>
        </div>


    </f:view>
</ui:composition>

</body>
</html>
