<html xmlns="http://www.w3.org/1999/xhtml"
  xmlns:ui="http://java.sun.com/jsf/facelets"
  xmlns:f="http://java.sun.com/jsf/core"
  xmlns:p="http://primefaces.org/ui"
    xmlns:c="http://java.sun.com/jstl/core"
  xmlns:h="http://java.sun.com/jsf/html"
  xmlns:t="http://myfaces.apache.org/tomahawk"
  xmlns:sp="http://sailpoint.com/ui">
<body>

<ui:composition>

  <sp:script>
    <src>#{base.requestContextPath}/scripts/sailpoint/Suggest.js?#{debug.revision}</src>
    <src>#{base.requestContextPath}/scripts/sailpoint/MultiSuggest.js?#{debug.revision}</src>
  </sp:script>

  <script type="text/javascript">
        Ext.onReady(function () {
        });    
    </script>

    <div class="spTabledContent">
      <table id="argumentTbl" class="argumentTbl argumentTblNoHelp customWidth paddedTbl" cellspacing="0">
        <tr>
          <th colspan="2"><h:outputText styleClass="spContentTitle" value="#{msgs.data_extract_task_options}"/></th>
        </tr>
        <tr>
          <td>
            <sp:outputText  value="#{taskDefinition.argMap['configuration'].argument.prompt}"/>
            <h:outputText styleClass="requiredText" value="*"/>
          </td>
          <td>
            <h:graphicImage
                id="imgHlpTaskDef#{taskDefinition.argMap['configuration'].argument.name}"
                rendered="#{taskDefinition.argMap['configuration'].argument.helpKey != null}"
                styleClass="helpIcon floatLeft"
                url="/images/icons/dashboard_help_16.png"
                alt="#{help[taskDefinition.argMap['configuration'].argument.helpKey]}" />
            <h:selectOneMenu id="de_yamlConfig" required="true"
                             value="#{taskDefinition.argMap['configuration'].value}">
              <f:selectItem itemLabel="#{msgs.select_extractConfig}" itemValue="" />
              <f:selectItems value="#{dataExtractConfig.DEYamlConfigs}"/>
            </h:selectOneMenu>
            <p:outputPanel>
              <p:autoUpdate />
              <h:message styleClass="formError" for="de_yamlConfig" />
            </p:outputPanel>
          </td>
        </tr>
        <tr>
          <td>
            <sp:outputText  value="#{taskDefinition.argMap['publisher'].argument.prompt}"/>
            <h:outputText styleClass="requiredText" value="*"/>
          </td>
          <td>
            <h:graphicImage
                id="imgHlpTaskDef#{taskDefinition.argMap['publisher'].argument.name}"
                rendered="#{taskDefinition.argMap['publisher'].argument.helpKey != null}"
                styleClass="helpIcon floatLeft"
                url="/images/icons/dashboard_help_16.png"
                alt="#{help[taskDefinition.argMap['publisher'].argument.helpKey]}" />
            <h:selectOneMenu id="de_publisher" required="true"
                             value="#{taskDefinition.argMap['publisher'].value}">
              <f:selectItem itemLabel="#{msgs.select_publisher}" itemValue="" />
              <f:selectItems value="#{dataExtractConfig.publisherNames}"/>
            </h:selectOneMenu>
            <p:outputPanel>
              <p:autoUpdate />
              <h:message styleClass="formError" for="de_publisher" />
            </p:outputPanel>
          </td>
        </tr>
      </table>
    </div>

  <script defer="defer">
    makeTableMulticolored(Ext.getDom('argumentTbl'),true,false, "even", "odd" );
  </script>

</ui:composition>

</body>
</html>
