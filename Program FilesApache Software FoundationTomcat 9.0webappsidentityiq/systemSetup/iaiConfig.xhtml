<html xmlns="http://www.w3.org/1999/xhtml"
  xmlns:ui="http://java.sun.com/jsf/facelets"
  xmlns:f="http://java.sun.com/jsf/core"
  xmlns:h="http://java.sun.com/jsf/html"
  xmlns:t="http://myfaces.apache.org/tomahawk"
  xmlns:sp="http://sailpoint.com/ui">

<body>

<ui:composition template="/appPage.xhtml">

  <ui:define name="title">#{msgs.iai_config_title}</ui:define>
  <ui:define name="headerItems">
    <script type="text/javascript">
        <!--//--><![CDATA[//><!--

        Ext.onReady(function () {
            toggleGenAIDesc();
        })

        function toggleGenAIDesc() {
            //let genAIDiv = Ext.getDom('GenAIDescDiv');
            let genAIEnabled = Ext.getDom('iaiConfigForm:genAIEntitlementDescCheckBox');
            let isEnabled = genAIEnabled && (genAIEnabled.checked == true);

            Ext.query('.conditionalDisplayElement').forEach(
                function(component) {
                    if(isEnabled) {
                        component.style.display = "";
                    } else {
                        component.style.display = "none";
                    }

                }
            );
        }

        //--><!]]>
    </script>
  </ui:define>

  <ui:define name="body">
    <h:outputText style="display:none" value="#{msgs[iaiConfigBean.pluginInstalled]}"/>
    <h:messages id="messages" infoClass="formInfo" warnClass="formWarn" errorClass="formError" fatalClass="formError"/>
    <h:form id="iaiConfigForm" styleClass="form" enctype="multipart/form-data" >
    <div class="spContent">
      <div class="spContentTitle">
        <h:outputText value="#{msgs.iai_config_connection_title}"/>
      </div>

      <p>
        <h:panelGrid columns="3" styleClass="spPaddedTable nowidth">
          <h:panelGroup>
            <h:outputText value="#{msgs.iai_config_hostname}"/>
            <h:outputText styleClass="requiredText" value="*"/>
          </h:panelGroup>
          <h:graphicImage id="imgHelpHostName" width="12px" title="#{help.help_iai_config_hostname}" height="12px" style="cursor:pointer;padding: 0px 7px 0px 7px" url="/images/icons/dashboard_help_16.png" />
          <h:inputText id="hostname" size="40" value='#{iaiConfigBean.hostname}' requiredMessage="#{msgs.iai_config_hostname_required}" required="true"/>
          <h:panelGroup>
            <h:outputText value="#{msgs.iai_config_client_id}"/>
            <h:outputText styleClass="requiredText" value="*"/>
          </h:panelGroup>
          <h:graphicImage id="imgHelpClientId" width="12px" title="#{help.help_iai_client_id}" height="12px" style="cursor:pointer;padding: 0px 7px 0px 7px" url="/images/icons/dashboard_help_16.png" />
          <h:inputText id="client_id" size="40" value='#{iaiConfigBean.clientId}' requiredMessage="#{msgs.iai_config_client_id_required}" required="true"/>
          <h:panelGroup>
            <h:outputText value="#{msgs.iai_config_client_secret}"/>
            <h:outputText styleClass="requiredText" value="*"/>
          </h:panelGroup>
          <h:graphicImage id="imgHelpClientSecret" width="12px" title="#{help.help_iai_client_secret}" height="12px" style="cursor:pointer;padding: 0px 7px 0px 7px" url="/images/icons/dashboard_help_16.png" />
          <h:inputSecret id="client_secret" size="40" value='#{iaiConfigBean.clientSecret}' requiredMessage="#{msgs.iai_config_client_secret_required}" redisplay="true" required="true" autocomplete="off"/>
        </h:panelGrid>
      </p>

      <div class="spContentTitle2">
        <h:outputText value="#{msgs.iai_config_advanced_title}"/>
      </div>
      <p>
        <h:panelGrid columns="3" styleClass="spPaddedTable nowidth">
          <h:outputText value="#{msgs.iai_config_read_timeout}"/>
          <h:inputText id="readTimeoutSeconds" size="5" value='#{iaiConfigBean.readTimeoutSeconds}'  required="false"/>
          <h:outputText value="#{msgs.seconds}"/>
          <h:outputText value="#{msgs.iai_config_connect_timeout}"/>
          <h:inputText id="connectTimeoutSeconds" size="5" value='#{iaiConfigBean.connectTimeoutSeconds}' required="false"/>
          <h:outputText value="#{msgs.seconds}"/>
        </h:panelGrid>
        <h:panelGrid columns="3" styleClass="spPaddedTable nowidth">
          <h:commandButton styleClass="secondaryBtn" value="#{msgs.button_test_connection}" action="#{iaiConfigBean.testAction}">
          	<f:ajax execute="hostname client_id  client_secret" render="messages"/>
          </h:commandButton>
        </h:panelGrid>
      </p>

      <div class="spContentTitle">
        <h:outputText value="#{msgs.iai_config_role_mining_title}"/>
      </div>
      <p>
        <h:panelGrid columns="3" styleClass="spPaddedTable nowidth">
          <h:panelGroup>
            <h:outputText value="#{msgs.iai_config_identity_now_url}"/>
            <h:outputText styleClass="requiredText" value="*"/>
          </h:panelGroup>
          <h:graphicImage id="imgHelpIdentityNowUrl" width="12px" title="#{help.help_iai_config_identity_now_url}" height="12px" style="cursor:pointer;padding: 0px 7px 0px 7px" url="/images/icons/dashboard_help_16.png" />
          <h:inputText id="identityNowUrl" size="40" value='#{iaiConfigBean.identityNowUrl}' requiredMessage="#{msgs.iai_config_identity_now_url_required}" required="true"/>
          <h:outputText value="#{msgs.iai_config_min_num_identities_role}"/>
          <h:graphicImage id="imgHelpMinIdentities" width="12px" title="#{help.help_iai_config_min_identities}" height="12px" style="cursor:pointer;padding: 0px 7px 0px 7px" url="/images/icons/dashboard_help_16.png" />
          <h:inputText id="minNumIdentitiesRole" size="5" value='#{iaiConfigBean.minNumIdentitiesRole}'  required="false"/>
        </h:panelGrid>
      </p>

      <div class="spContentTitle">
        <h:outputText value="#{msgs.iai_config_genai_settings_title}"/>
      </div>

      <p>
        <h:panelGrid columns="3" styleClass="spPaddedTable nowidth">
          <h:panelGroup>
            <h:outputText value="#{msgs.iai_config_enable_genai_entitlement_desc}"/>
          </h:panelGroup>
          <h:panelGroup>
            <h:graphicImage id="imgHelpEntitlementDesc" width="12px" title="#{help.help_iai_config_genai_entitlement_desc}" height="12px" style="cursor:pointer;padding: 0px 7px 0px 7px" url="/images/icons/dashboard_help_16.png"/>
          </h:panelGroup>
          <h:panelGroup>
            <h:selectBooleanCheckbox id="genAIEntitlementDescCheckBox" binding="#{genAICheckbox}"  name="genAIEntitlementDescCheckBox" value="#{iaiConfigBean.genAIEntitlementDescriptionEnabled}"
                                     onclick="javascript:toggleGenAIDesc();"/>
          </h:panelGroup>

          <h:panelGroup styleClass="conditionalDisplayElement" style="display:none">
            <h:outputText value="#{msgs.iai_config_prune_after_days_desc}" disabled="#{!sp:hasRight(facesContext, 'GenAIEntitlementAdministrator, ManagedAttributePropertyAdministrator')}"/>
          </h:panelGroup>
          <h:panelGroup styleClass="conditionalDisplayElement" style="display:none">
            <h:graphicImage id="imgHelpPrudeDays" width="12px" title="#{help.help_iai_config_prune_after_days}" height="12px" style="cursor:pointer;padding: 0px 7px 0px 7px" url="/images/icons/dashboard_help_16.png" />
          </h:panelGroup>
          <h:panelGroup styleClass="conditionalDisplayElement" style="display:none">
            <h:inputText id="pruneAfterDays" size="12" value='#{iaiConfigBean.noOfDays}' requiredMessage="#{msgs.iai_config_hostname_required}" required="false" >
              <f:validateLongRange minimum="0" maximum="99999" />
            </h:inputText>
          </h:panelGroup>

          <h:panelGroup styleClass="conditionalDisplayElement" style="display:none">
            <h:outputText value="#{msgs.iai_config_enable_genai_entitlement_approval}"/>
          </h:panelGroup>
          <h:panelGroup styleClass="conditionalDisplayElement" style="display:none">
            <h:graphicImage id="imgHelpEntitlementApproval" width="12px" title="#{help.help_iai_config_genai_entitlement_approval}" height="12px" style="cursor:pointer;padding: 0px 7px 0px 7px" url="/images/icons/dashboard_help_16.png"/>
          </h:panelGroup>
          <h:panelGroup styleClass="conditionalDisplayElement" style="display:none">
            <h:selectBooleanCheckbox id="genAIEntitlementApprovalCheckBox" value="#{iaiConfigBean.genAIEntitlementApprovalEnabled}"/>
          </h:panelGroup>

        </h:panelGrid>
      </p>
      <div id="GenAIDescDiv" class="conditionalDisplayElement" style="display:none" >
      <div class="spContentTitle2">
        <h:outputText value="#{msgs.iai_config_genai_connection_title}"/>
      </div>

      <p>
        <h:panelGrid columns="3" styleClass="spPaddedTable nowidth">
          <h:panelGroup>
            <h:outputText value="#{msgs.iai_config_llm_proxy_hostname}"/>
            <h:outputText styleClass="requiredText" value="*"/>
          </h:panelGroup>
          <h:graphicImage id="imgHelpLlmProxyHostName" width="12px" title="#{help.help_iai_config_llm_proxy_hostname}" height="12px" style="cursor:pointer;padding: 0px 7px 0px 7px" url="/images/icons/dashboard_help_16.png" />
          <h:inputText id="llmProxyHostname" size="40" value='#{iaiConfigBean.llmProxyHostname}' requiredMessage="#{msgs.iai_config_llm_proxy_hostname_required}" required="#{genAICheckbox.value eq true }"/>
          <h:panelGroup>
            <h:outputText value="#{msgs.iai_config_llm_proxy_client_id}"/>
            <h:outputText styleClass="requiredText" value="*"/>
          </h:panelGroup>
          <h:graphicImage id="imgHelpLlmProxyClientId" width="12px" title="#{help.help_iai_llm_proxy_client_id}" height="12px" style="cursor:pointer;padding: 0px 7px 0px 7px" url="/images/icons/dashboard_help_16.png" />
          <h:inputText id="llm_proxy_client_id" size="40" value='#{iaiConfigBean.llmProxyClientId}' requiredMessage="#{msgs.iai_config_llm_proxy_client_id_required}" required="#{genAICheckbox.value eq true }"/>
          <h:panelGroup>
            <h:outputText value="#{msgs.iai_config_llm_proxy_client_secret}"/>
            <h:outputText styleClass="requiredText" value="*"/>
          </h:panelGroup>
          <h:graphicImage id="imgHelpLlmProxyClientSecret" width="12px" title="#{help.help_iai_llm_proxy_client_secret}" height="12px" style="cursor:pointer;padding: 0px 7px 0px 7px" url="/images/icons/dashboard_help_16.png" />
          <h:inputSecret id="llm_proxy_client_secret" size="40" value='#{iaiConfigBean.llmProxyClientSecret}' requiredMessage="#{msgs.iai_config_llm_proxy_client_secret_required}" redisplay="true" required="#{genAICheckbox.value eq true }" autocomplete="off"/>
        </h:panelGrid>
      </p>

      <div class="spContentTitle2">
        <h:outputText value="#{msgs.iai_genai_config_advanced_title}"/>
      </div>
      <p>
        <h:panelGrid columns="3" styleClass="spPaddedTable nowidth">
          <h:outputText value="#{msgs.iai_config_llm_proxy_read_timeout}"/>
          <h:inputText id="llmProxyReadTimeoutSeconds" size="5" value='#{iaiConfigBean.llmProxyReadTimeoutSeconds}'  required="false"/>
          <h:outputText value="#{msgs.seconds}"/>
          <h:outputText value="#{msgs.iai_config_llm_proxy_connect_timeout}"/>
          <h:inputText id="llmProxyConnectTimeoutSeconds" size="5" value='#{iaiConfigBean.llmProxyConnectTimeoutSeconds}' required="false"/>
          <h:outputText value="#{msgs.seconds}"/>
        </h:panelGrid>
        <h:panelGrid columns="3" styleClass="spPaddedTable nowidth">
          <h:commandButton styleClass="secondaryBtn" value="#{msgs.button_test_connection}" action="#{iaiConfigBean.testActionGenAI}">
          	<f:ajax execute="llmProxyHostname llm_proxy_client_id  llm_proxy_client_secret" render="messages"/>
          </h:commandButton>
        </h:panelGrid>
      </p>
      </div>



      <div class="buttonRow">
        <h:commandButton styleClass="primaryBtn" value="#{msgs.button_save}" action="#{iaiConfigBean.saveAction}">
        	<f:ajax execute="@form"  render="messages"/>
        </h:commandButton>
        <h:commandButton styleClass="secondaryBtn" value="#{msgs.button_return_to_system_setup}" action="#{iaiConfigBean.cancelAction}" immediate="true"/>
      </div>

    </div>
    </h:form>
  </ui:define>
</ui:composition>

</body>
</html>
