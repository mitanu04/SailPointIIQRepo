<!DOCTYPE html PUBLIC
    "-//W3C//DTD XHTML 1.0 Transitional//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">

<html lang="en"
      xmlns="http://www.w3.org/1999/xhtml"
      xml:lang="en"
      xmlns:sp="http://sailpoint.com/ui"
      xmlns:ui="http://java.sun.com/jsf/facelets"
      xmlns:h="http://java.sun.com/jsf/html">

<body>

<ui:composition template="/ngAppPage.xhtml">
  <sp:loadBundle basename="sailpoint.web.messages.iiqMessages" var="msgs"/>

  <ui:define name="title">#{msgs.ui_accesshistory_config_title}</ui:define>
  <ui:define name="headerItems">

    <ui:include src="../ui/scriptData.xhtml"/>
    <script type="text/javascript">
        SailPoint.ACCESSHISTORY_CONFIG_FULL_ACCESS = #{sp:hasRight(facesContext, "AccessHistoryFullAccessConfiguration")};
    </script>
    <ui:include src="../ui/jspmInclude.xhtml"/>
    <script type="text/javascript">
        System.import('#{base.requestContextPath}/ui/js/accessHistory/AccessHistoryAppModule.js');
    </script>
  </ui:define>

  <ui:define name="body">
    <div class="sp-ui-app" ng-cloak="">
      <div id="notificationDiv" class="sr-only" role="alert" aria-live="assertive"></div>
      <sp-notification sp-triggerable="true"></sp-notification>
      <div ui-view=""></div>
      <section class="container-fluid bg-light m-t" ng-controller="AccessHistoryConfigurationCtrl as accessHistoryConfigCtrl">
        <div class="row header">
          <h2>{{ 'ui_accesshistory_config_title' | spTranslate }}</h2>
        </div>
        <span ng-if="accessHistoryConfigCtrl.errorMessages">
            <div id="alertDiv" class="alert alert-danger" role="alert" tabindex="0">
              <i role="presentation"
                 class="fa fa-exclamation-triangle"></i> {{ accessHistoryConfigCtrl.errorMessages | spTranslate }}
            </div>
        </span>
        <form name="accessHistoryConfigForm" novalidate="novalidate" autocomplete="false">
          <div id="accessHistoryConfigDiv" class="panel">
            <div class="form-group page-settings-container">
              <h4 class="settings-title">{{ 'ui_accesshistory_config_controls' | spTranslate }}</h4>
              <div class="form-group row col-sm-12">
                <div class="form-group row col-sm-12">
                  <sp-checkbox ng-model="accessHistoryConfigCtrl.accessHistoryConfig.accessHistoryEnabled"
                               sp-id="accessHistoryEnabled"
                               sp-display-name="{{ 'ui_accesshistory_config_enable_access_history_label' | spTranslate }}"
                               sp-label="{{ 'ui_accesshistory_config_enable_access_history_label' | spTranslate }}"
                               sp-disabled="false"
                               class="control-label"/>
              </div>
              </div>
              <br/><br/>
              <div class="button-group row">
                <div class="col-sm-12">
                  <button type="button"
                          id="cancelBtn"
                          class="btn btn-secondary"
                          ng-click="accessHistoryConfigCtrl.cancel()">{{ 'ui_button_return_to_system_setup' | spTranslate }}
                  </button>
                  <button type="submit"
                          id="submitBtn"
                          class="btn btn-primary"
                          aria-label="{{ 'ui_accesshistory_config_button_save_aria_label' | spTranslate }}"
                          ng-disabled="accessHistoryConfigForm.$invalid || !accessHistoryConfigCtrl.hasChanges()"
                          ng-click="accessHistoryConfigCtrl.saveConfig()">{{ 'ui_accesshistory_config_button_save_label' | spTranslate }}
                  </button>
                </div>
              </div>
            </div>
          </div>
        </form>
      </section>
    </div>
  </ui:define>
</ui:composition>
</body>
</html>
